study: mortalidade_infantil_br
topic:
  seeds:                       # the topic: ICD-10 codes (any level), SINAN agravos, label terms
    records:
      - {"dataset": "SIM-DO", "name": "infant death", "condition": [{"role": "deceased.age_years", "op": "<", "value": 1}], "per": "SINASC-DN"}
period: 2014-2023               # first-last year
where: BR                    # BR, states (AL or 27, several as a list) or municipality codes
depth: standard               # survey, standard, deep or exhaustive: presets of the choices below
# related: 3                   # related codes read beside the topic's own, strongest first (0: none)
# persons: true                # the cohort scan over linked persons (deep and exhaustive)
# download: 10                 # gigabytes the study may download (years held in the lake are free)
contexts: [persons_low_income, population_urban, cnes_teams_esf, households_sewer_network, persons_15_plus_literate]
