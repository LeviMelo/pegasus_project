# abnc_t08: written by `pegasus study new`; every key is described in the README and ARCHITECTURE §3.1.
study: abnc_t08
topic:
  seeds:                       # the topic: ICD-10 codes (any level), SINAN agravos, label terms
    sigtap: ["040803"]
period: 2010-2024               # first-last year
where: BR                    # BR, states (AL or 27, several as a list) or municipality codes
depth: standard               # survey, standard, deep or exhaustive: presets of the choices below
# related: 3                   # related codes read beside the topic's own, strongest first (0: none)
# persons: true                # the cohort scan over linked persons (deep and exhaustive)
# download: 10                 # gigabytes the study may download (years held in the lake are free)
contexts: auto                 # municipal contexts related to the rates (auto: every declared one)
# hypotheses:                  # declared tests, e.g. an outbreak or a relation with its lags
#   - {component: transient, where: [431690], when: 2018, note: a documented outbreak}
# context candidates decided from what each group holds (abnc2027_neuro analysis/s2_contexts.py)
line: abnc_neuro
contexts_considered:
  sidra:CD:Características do domicílio:
    decision: exclude
    why: 'Census 2022 ''Características do domicílio'' tables (as named by IBGE): not in this paper''s models: socioeconomic position enters as the Census low-income share (and literacy where used), urbanisation as the urban share, both included from their own groups, and age enters through standardisation'
  sidra:CD:Educação:
    decision: include
    why: municipal covariate of the paper's models (literacy 15+; lib/covariates.py), built from the declared fields persons_15_plus, persons_15_plus_literate
  sidra:CD:Pessoas:
    decision: include
    why: municipal covariate of the paper's models (literacy 15+, urban share; lib/covariates.py), built from the declared fields persons_15_plus, persons_15_plus_literate, population_resident_census, population_urban
  sidra:CD:Rendimento:
    decision: include
    why: municipal covariate of the paper's models (low-income share; lib/covariates.py), built from the declared fields persons_income_universe, persons_low_income
  sidra:XN:Acidentes:
    decision: exclude
    why: 'PNS accidents, alcohol, violence, older adults'' limitations, service use and chronic diseases by state: not on the pathway of spine surgery in this paper'
  sidra:XN:Doenças crônicas:
    decision: include
    why: 'state-level covariate read directly, 27 units, with CIs; field pending state grain: PNS chronic spine problems (SIDRA 4638; limits 4616/4617), the disease denominator against which SUS spine-surgery rates are read at state level'
  sidra:XN:Idosos:
    decision: exclude
    why: 'PNS accidents, alcohol, violence, older adults'' limitations, service use and chronic diseases by state: not on the pathway of spine surgery in this paper'
  sidra:XN:Uso de serviço de saúde:
    decision: exclude
    why: 'PNS accidents, alcohol, violence, older adults'' limitations, service use and chronic diseases by state: not on the pathway of spine surgery in this paper'
  sidra:XN:Uso de álcool:
    decision: exclude
    why: 'PNS accidents, alcohol, violence, older adults'' limitations, service use and chronic diseases by state: not on the pathway of spine surgery in this paper'
  sidra:XN:Violência:
    decision: exclude
    why: 'PNS accidents, alcohol, violence, older adults'' limitations, service use and chronic diseases by state: not on the pathway of spine surgery in this paper'
  sidra:AA:Acidentes, violência e segurança:
    decision: exclude
    why: 'PeNSE: behaviours of 9th-grade schoolchildren, not the population of spine surgery'
  sidra:AA:Segurança:
    decision: exclude
    why: 'PeNSE: behaviours of 9th-grade schoolchildren, not the population of spine surgery'
  sidra:B5:Furto e roubo:
    decision: exclude
    why: 'PNAD Contínua labour, income, housing, disability and victimisation by state: income and work are carried by the declared Census fields at municipal grain'
  sidra:IO:Contas Nacionais e Regionais:
    decision: include
    why: municipal covariate of the paper's models (GDP per capita; lib/covariates.py), built from the declared fields gdp
  sidra:PC:Índices de preços:
    decision: exclude
    why: 'national price indices: used as deflators through pegasus_data price_index, not as a place context'
  sidra:IA:Índices de preços:
    decision: exclude
    why: 'national price indices: used as deflators through pegasus_data price_index, not as a place context'
  intake:ans:
    decision: include
    why: 'ANS beneficiary links by municipality, sex and age band (declared field ans_beneficiaries_quarterly): the denominator of the age-sex standardised private-plan comparison (section private2)'
  intake:ans_tiss_hosp_cons:
    decision: include
    why: 'private hospital events with sex, age band, residence and length of stay: the private side of spine surgery (sections private, private2, stay)'
  pns_chronic_spine_problem_percent:
    decision: include
    why: state-grain covariate (27 units), read through load_field and used only in state-level analyses with its CI limits; PegaSUS's state-grain reading pending
  "sidra:IU:Coeficiente de mortalidade por homicídios ou por acidentes de transporte":
    decision: exclude
    why: "population health and fertility indicators: none measures spine disease; the PNS chronic spine-problem prevalence is the need term used"
  "sidra:C2:Boa saúde e bem-estar":
    decision: exclude
    why: "population health and fertility indicators: none measures spine disease; the PNS chronic spine-problem prevalence is the need term used"
  "sidra:C2:Paz, justiça e instituições eficazes":
    decision: exclude
    why: "economic, environmental or administrative statistics with no pathway to spine-surgery rates in people"
  "intake:siops_municipal":
    decision: exclude
    why: "municipal health spending: the paper's payment measure is the federal SIH payment per stay; municipal co-financing cannot be attributed to spine stays"
  "field:brdwgd:gaussian":
    decision: exclude
    why: "climate and weather: no pathway from climate to spine-surgery rates over a decade"
  "field:intake:ans_tiss_hospital_items":
    decision: include
    why: "private-plan hospital billing items with TUSS procedure codes: the spine-surgery terms mapped to SIGTAP (section private)"
  "field:inmet:climate":
    decision: exclude
    why: "climate and weather: no pathway from climate to spine-surgery rates over a decade"
  "field:brdwgd:climate_monthly":
    decision: exclude
    why: "climate and weather: no pathway from climate to spine-surgery rates over a decade"
  "field:cnes:beds":
    decision: include
    why: "SUS neurosurgical beds per 100,000 of the health region (section supply); the other bed types are not the spine pathway's"
  "field:cnes:radiotherapy_machines":
    decision: exclude
    why: "radiotherapy machines: off the spine-surgery pathway"
  "field:cnes:professionals":
    decision: include
    why: "neurosurgeons and orthopaedists per 100,000 of the health region (sections supply, supply2, space); the other professions are not spine operators"
  "field:cnes:equipment":
    decision: exclude
    why: "imaging and other equipment counts: the indication for spine surgery is not modelled on scanner supply, and the surgeon and bed terms carry supply"
  "field:cnes:facilities":
    decision: include
    why: "the hospital's legal nature (public, non-profit, business) for payment by legal nature (section money_legal)"
  "field:brdwgd:precipitation_months":
    decision: exclude
    why: "climate and weather: no pathway from climate to spine-surgery rates over a decade"
  "field:records:SIM-DO":
    decision: exclude
    why: "death-certificate fields as context: the paper uses no certificate field; death after discharge could not be linked (post-discharge pass rejected)"
  "field:brdwgd:temperature_months":
    decision: exclude
    why: "climate and weather: no pathway from climate to spine-surgery rates over a decade"
