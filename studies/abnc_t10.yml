  field:cnes:professionals:
    decision: include
    why: 'Neurosurgeons (CBO 225260) with an SUS link, 2011-2023: the supply panel (Figure 4D). Read at professional and hospital grain from the CNES-PF records (outcomes/t10_cnes_supply.py,
      open_lake cnes_pf), finer than this municipal field, so the field itself is not read; the other professions in the family are not part of a neurosurgical payment
      study.'
  field:cnes:accreditations:
    decision: include
    why: 'Units accredited for neurosurgical high complexity (habilitations 1601/1602), 2014-2025: the supply panel (Figure 4D). Read at establishment grain from the
      CNES-HB records (outcomes/t10_cnes_supply.py, open_lake cnes_hb), so the municipal field is not read; the oncology, stroke and other accreditations of the family
      are outside t10''s subject.'
  field:intake:ans_tiss_hospital_items:
    decision: include
    why: 'ANS TISS hospital items by procedure: the private-plan fee comparison, 2023-2024 (already the context field ans_tiss_hospital_items; Results, what private plans paid).'
  field:intake:ans_tiss_hospital_remuneration:
    decision: exclude
    why: 'ANS TISS remuneration model per hospital event (fee-for-service, package, other), from May 2023: the comparison is the value paid per procedure code, which
      the remuneration model does not change; how plans contract hospitals is outside the SUS payment question.'
  field:intake:ans_tiss_outpatient_items:
    decision: exclude
    why: 'ANS TISS outpatient items: t10 compares hospital payment per neurosurgical admission; outpatient procedures are not in the 0403 hospital AIHs.'
  field:intake:ans_tiss_outpatient_remuneration:
    decision: exclude
    why: 'ANS TISS outpatient remuneration model: outpatient care, not neurosurgical hospital payment.'
  field:cnes:beds:
    decision: exclude
    why: 'CNES beds (ICU, neurology, neurosurgery) by municipality: supply is measured as neurosurgeons and accredited units, the inputs the payment reaches; intensive
      care enters as ICU days and items within each AIH (SIH-SP). Stated as available and not used in the data extent.'
  field:cnes:equipment:
    decision: exclude
    why: 'CNES equipment (CT, MRI and others) by municipality: diagnostic equipment is paid outside the neurosurgical AIH (SIA), so it neither enters the payment studied
      nor measures neurosurgical capacity better than surgeons and accredited units.'
  field:cnes:facilities:
    decision: exclude
    why: 'Counts of SUS and non-SUS facilities by municipality: hospitals billing neurosurgery are counted directly from the AIHs (Figure 4D), which is the payment-relevant
      set.'
  field:cnes:specialised_services:
    decision: exclude
    why: 'CNES neurology/neurosurgery service classification by municipality: the accreditation (1601/1602) is what qualifies a hospital for high-complexity neurosurgical
      payment and is used; the service code adds no payment information.'
  field:cnes:teams:
    decision: exclude
    why: 'Primary-care teams (ESF, eAB/eAP): primary care, not neurosurgical hospital payment.'
  field:cnes:radiotherapy_machines:
    decision: exclude
    why: 'Radiotherapy machines: oncology supply, outside neurosurgical hospital payment.'
  field:records:SIM-DO:
    decision: include
    why: 'Death certificates (SIM): the 30-day death after cranial-core surgery is linked to SIM (probabilistic, sih_admissions_to_sim; outcomes/t10_link_deaths.py), and the completeness of the linkage fields and the ill-defined share of deaths (fields sim_deaths_ill_defined, sim_deaths_residence) are reported for 2012-2014 against 2022-2024 (analysis/t10_final.py sim_completeness).'
  field:inmet:climate:
    decision: exclude
    why: 'Climate by municipality: t10''s unit is the procedure, the admission and the hospital (payment per AIH by code, state and legal nature); weather does not
      enter fee-table values or federal payment per admission.'
  field:brdwgd:gaussian:
    decision: exclude
    why: 'Climate by municipality: t10''s unit is the procedure, the admission and the hospital (payment per AIH by code, state and legal nature); weather does not
