# abnc_t10: written by `pegasus study new`; every key is described in the README and ARCHITECTURE §3.1.
study: abnc_t10
topic:
  seeds:                       # the topic: ICD-10 codes (any level), SINAN agravos, label terms
    sigtap: ["0403"]
period: 2010-2024               # first-last year
where: BR                    # BR, states (AL or 27, several as a list) or municipality codes
depth: standard               # survey, standard, deep or exhaustive: presets of the choices below
# related: 3                   # related codes read beside the topic's own, strongest first (0: none)
# persons: true                # the cohort scan over linked persons (deep and exhaustive)
# download: 10                 # gigabytes the study may download (years held in the lake are free)
contexts: [ans_tiss_hospital_events, ans_tiss_hospital_items, siops_health_spending, siops_health_spending_own_resources, siops_health_transfers_sus]   # decided 2026-11-23 (contexts_considered below); IPCA/INPC read via price_index (series, not fields)
# hypotheses:                  # declared tests, e.g. an outbreak or a relation with its lags
#   - {component: transient, where: [431690], when: 2018, note: a documented outbreak}
# every context candidate of the scope decided from what its group holds (abnc2027_neuro papers/t10/contexts_considered.yml)
line: abnc_neuro
contexts_considered:
  intake:ans:
    decision: exclude
    why: 't10''s unit is the procedure, the admission and the hospital (payment per AIH, by state and legal nature); no per-capita rate or population context enters it, so this group, relevant to a population study, is not used here. (draft note: ANS beneficiaries by municipality, age and sex, assistance coverage (December of each year): private-plan coverage by state and municipality (QT_BENEFICIARIO_ATIVO over population), the main private coverage measure.)'
  intake:ans_tiss_hosp_cons:
    decision: include
    why: 'ANS TISS hospital events: the private-plan fee comparison (events and paid items, 2023-2024; fields ans_tiss_hospital_items and ans_tiss_hospital_events).'
  intake:siops_municipal:
    decision: include
    why: 'SIOPS municipal health spending (total, own resources, SUS transfers), municipality-year 2010-2024, deflated with price_index: context for who finances the SUS beside the federal SIH payment (Discussion; supplement, municipal health spending).'
  sidra:AA:Acidentes, violência e segurança:
    decision: exclude
    why: 'PeNSE school-survey tables on 9th-grade pupils (2012-2015): adolescent behaviour and school characteristics, not hospital payment, supply or coverage in the adult neurosurgical population.'
  sidra:AA:Segurança:
    decision: exclude
    why: 'PeNSE school-survey tables on 9th-grade pupils (2012-2015): adolescent behaviour and school characteristics, not hospital payment, supply or coverage in the adult neurosurgical population.'
  sidra:B5:Furto e roubo:
    decision: exclude
    why: 'PNAD Continua theft and robbery victimisation 2021: crime module, no bearing on hospital payment.'
  sidra:C2:Boa saúde e bem-estar:
    decision: exclude
    why: SDG health indicators (cardiovascular, cancer, diabetes and respiratory mortality, road-traffic mortality, maternal and under-5 mortality, and others), state grain; t10's unit is the procedure, the admission and the hospital; a state-grain indicator with no bearing on hospital payment is not used.
  sidra:C2:Paz, justiça e instituições eficazes:
    decision: exclude
    why: Homicide victims per 100,000, state grain; t10's unit is the procedure, the admission and the hospital; a state-grain indicator with no bearing on hospital payment is not used.
  sidra:CD:Características do domicílio:
    decision: exclude
    why: 'Census table on a demographic or housing topic (race, religion, migration, fertility, housing, disability, indigenous or quilombola groups): no variable for payment, supply, income or coverage beyond groups already included.'
  sidra:CD:Educação:
    decision: exclude
    why: 't10''s unit is the procedure, the admission and the hospital (payment per AIH, by state and legal nature); no per-capita rate or population context enters it, so this group, relevant to a population study, is not used here. (draft note: Census 2010 schooling and literacy: educational level of the population by state and municipality, a standard socioeconomic gradient for access to private care.)'
  sidra:CD:Pessoas:
    decision: exclude
    why: 't10''s unit is the procedure, the admission and the hospital (payment per AIH, by state and legal nature); no per-capita rate or population context enters it, so this group, relevant to a population study, is not used here. (draft note: Census population by sex, age and residence (1970-2010): population served and age structure by state and municipality, denominators for neurosurgical volume per capita.)'
  sidra:CD:Rendimento:
    decision: exclude
    why: 't10''s unit is the procedure, the admission and the hospital (payment per AIH, by state and legal nature); no per-capita rate or population context enters it, so this group, relevant to a population study, is not used here. (draft note: Census household and personal income tables (2000 and 2010): income of the population served and its distribution by state and municipality, to explain demand for private plans versus SUS.)'
  sidra:IA:Índices de preços:
    decision: include
    why: 'IPCA, the paper''s deflator: read via pegasus_data.price_index (series price_index_ipca).'
  sidra:IO:Contas Nacionais e Regionais:
    decision: exclude
    why: 't10''s unit is the procedure, the admission and the hospital (payment per AIH, by state and legal nature); no per-capita rate or population context enters it, so this group, relevant to a population study, is not used here. (draft note: Municipal GDP and gross value added by activity (1999-2023, tables 21 and 5938), including public administration, health and education: income of the area and size of the public sector by state and municipality. Nearest proxy to public activity but NOT health spending.)'
  sidra:IU:Coeficiente de mortalidade por homicídios ou por acidentes de transporte:
    decision: exclude
    why: Mortality from homicide and land transport accidents, state grain, 1992-2012; t10's unit is the procedure, the admission and the hospital; a state-grain indicator with no bearing on hospital payment is not used.
  sidra:PC:Índices de preços:
    decision: include
    why: 'INPC, the deflator sensitivity: read via pegasus_data.price_index (series price_index_inpc); its health sub-items are not used.'
  sidra:XN:Acidentes:
    decision: exclude
    why: 'PNS 2013/2019 table on individual health behaviour or morbidity: describes risk factors or disease prevalence, not payment, supply, income or coverage.'
  sidra:XN:Doenças crônicas:
    decision: exclude
    why: 'PNS 2013/2019 table on individual health behaviour or morbidity: describes risk factors or disease prevalence, not payment, supply, income or coverage.'
  sidra:XN:Idosos:
    decision: exclude
    why: 'PNS 2013/2019 table on individual health behaviour or morbidity: describes risk factors or disease prevalence, not payment, supply, income or coverage.'
  sidra:XN:Uso de serviço de saúde:
    decision: exclude
    why: 't10''s unit is the procedure, the admission and the hospital (payment per AIH, by state and legal nature); no per-capita rate or population context enters it, so this group, relevant to a population study, is not used here. (draft note: PNS 2013/2019 use of health services (urgent care, hospitalisation, who paid, SUS versus private) by state: share of care taken in SUS versus private, context for payment rules.)'
  sidra:XN:Uso de álcool:
    decision: exclude
    why: 'PNS 2013/2019 table on individual health behaviour or morbidity: describes risk factors or disease prevalence, not payment, supply, income or coverage.'
  sidra:XN:Violência:
    decision: exclude
    why: 'PNS 2013/2019 table on individual health behaviour or morbidity: describes risk factors or disease prevalence, not payment, supply, income or coverage.'
  field:cnes:professionals:
    decision: include
    why: 'Neurosurgeons (CBO 225260) with an SUS link, 2011-2023: the supply panel (Figure 4D). Read at professional and hospital grain from the CNES-PF records (outcomes/t10_cnes_supply.py, open_lake cnes_pf), finer than this municipal field, so the field itself is not read; the other professions in the family are not part of a neurosurgical payment study.'
  field:intake:ans_tiss_hospital_items:
    decision: include
    why: 'ANS TISS hospital items by procedure: the private-plan fee comparison, 2023-2024 (already the context field ans_tiss_hospital_items; Results, what private plans paid).'
  field:cnes:beds:
    decision: exclude
    why: 'CNES beds (ICU, neurology, neurosurgery) by municipality: supply is measured as neurosurgeons and accredited units, the inputs the payment reaches; intensive care enters as ICU days and items within each AIH (SIH-SP). Stated as available and not used in the data extent.'
  field:cnes:equipment:
    decision: exclude
    why: 'CNES equipment (CT, MRI and others) by municipality: diagnostic equipment is paid outside the neurosurgical AIH (SIA), so it neither enters the payment studied nor measures neurosurgical capacity better than surgeons and accredited units.'
  field:cnes:facilities:
    decision: exclude
    why: 'Counts of SUS and non-SUS facilities by municipality: hospitals billing neurosurgery are counted directly from the AIHs (Figure 4D), which is the payment-relevant set.'
  field:cnes:radiotherapy_machines:
    decision: exclude
    why: 'Radiotherapy machines: oncology supply, outside neurosurgical hospital payment.'
  field:records:SIM-DO:
    decision: include
    why: 'Death certificates (SIM): the 30-day death after cranial-core surgery is linked to SIM (probabilistic, sih_admissions_to_sim; outcomes/t10_link_deaths.py), and the completeness of the linkage fields and the ill-defined share of deaths (fields sim_deaths_ill_defined, sim_deaths_residence) are reported for 2012-2014 against 2022-2024 (analysis/t10_final.py sim_completeness).'
  field:inmet:climate:
    decision: exclude
    why: 'Climate by municipality: t10''s unit is the procedure, the admission and the hospital (payment per AIH by code, state and legal nature); weather does not enter fee-table values or federal payment per admission.'
  field:brdwgd:gaussian:
    decision: exclude
    why: 'Climate by municipality: t10''s unit is the procedure, the admission and the hospital (payment per AIH by code, state and legal nature); weather does not enter fee-table values or federal payment per admission.'
  field:brdwgd:climate_monthly:
    decision: exclude
    why: 'Climate by municipality: t10''s unit is the procedure, the admission and the hospital (payment per AIH by code, state and legal nature); weather does not enter fee-table values or federal payment per admission.'
  field:brdwgd:precipitation_months:
    decision: exclude
    why: 'Climate by municipality: t10''s unit is the procedure, the admission and the hospital (payment per AIH by code, state and legal nature); weather does not enter fee-table values or federal payment per admission.'
  field:brdwgd:temperature_months:
    decision: exclude
    why: 'Climate by municipality: t10''s unit is the procedure, the admission and the hospital (payment per AIH by code, state and legal nature); weather does not enter fee-table values or federal payment per admission.'
