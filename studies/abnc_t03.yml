    why: 'National Health Survey (Vida sexual): self-reported behaviour, two waves, state grain; a risk factor of incidence, not of the care pathway after surgery.'
  sidra:XN:Violência:
    decision: exclude
    why: 'National Health Survey 2013 interpersonal violence: single wave, sample, state grain; assault enters through the S0x and external-cause codes of the stays.'
  sidra:XY:Indústria:
    decision: exclude
    why: Business or production survey of enterprises (industrial employment and wages, ends 2015), state grain; economic activity of firms is not a covariate of
      the paper, whose economic field is municipal GDP.
  field:cnes:professionals:
    decision: include
    why: 'SUS-linked neurosurgeons per 100,000 in the health region of residence (field cnes_neurosurgeons_professionals, already a context): supply term in the model
      of surgery outside the accredited network (analysis/t03_supply.py) and in the patient context (lib/context). The family''s other professions do not bear on who
      can do a craniectomy.'
  field:cnes:equipment:
    decision: include
    why: 'SUS CT scanners per 100,000 in the health region of residence (field cnes_equipment_ct_sus, already a context): diagnosis of the indications (head injury,
      stroke) needs CT, so CT access enters the model of surgery outside the accredited network (analysis/t03_supply.py). MRI and the other equipment do not bear on
      it.'
  field:cnes:beds:
    decision: include
    why: 'SUS ICU and neurosurgery beds per 100,000 in the health region of residence (fields cnes_beds_icu_sus, cnes_beds_neurosurgery_sus, already contexts): supply
      terms in the model of surgery outside the accredited network (analysis/t03_supply.py); craniectomy needs intensive care after surgery.'
  field:cnes:accreditations:
    decision: include
    why: 'Neurosurgical high-complexity accreditation (1601/1602), the paper''s exposure: read at establishment grain from the CNES-HB records for the treating hospital
      (lib/context.with_accreditation) and for the distance to the nearest accredited unit (lib/access), finer than this municipal field, so the field itself is not
      read; stroke-centre and thrombectomy flags are joined too; the oncology and other accreditations of the family are outside t03.'
  field:records:SIM-DO:
    decision: include
    why: 'Deaths by residence and certification quality (fields sim_deaths_residence, sim_deaths_ill_defined, sim_deaths_garbage_codes): the paper reads SIM head-injury
      deaths outside hospital by region (selection before admission) and links deaths after discharge; the ill-defined and garbage shares by region are set beside that
      contrast (analysis/t03_supply.py).'
  field:cnes:specialised_services:
    decision: exclude
    why: 'CNES neurology/neurosurgery service classification by municipality: accreditation (1601/1602) is the paper''s exposure and defines the network; the service
      code adds no information on where craniectomy may be done.'
  field:cnes:facilities:
    decision: exclude
    why: 'Counts of SUS and non-SUS facilities by municipality: the hospitals that operate are observed directly from the AIHs, with their accreditation and volume;
      a count of all facilities does not measure surgical capacity.'
  field:cnes:teams:
    decision: exclude
    why: 'Primary-care teams (ESF, eAB/eAP): craniectomy follows emergency admission for trauma or stroke, not primary-care coverage.'
  field:cnes:radiotherapy_machines:
    decision: exclude
    why: 'Radiotherapy machines: oncology supply; tumour indications are excluded from the main contrasts.'
  field:intake:ans_tiss_hospital_items:
    decision: exclude
    why: 'ANS TISS hospital items by procedure: private-plan prices; t03''s private context is plan coverage (ans_beneficiaries) and CIHA admissions outside SUS funding,
      not item values.'
  field:intake:ans_tiss_hospital_remuneration:
    decision: exclude
    why: 'ANS TISS remuneration model per hospital event: how plans pay providers, not where or how a craniectomy is done in the SUS.'
  field:intake:ans_tiss_outpatient_items:
    decision: exclude
    why: 'ANS TISS outpatient items: craniectomy is a hospital procedure.'
  field:intake:ans_tiss_outpatient_remuneration:
    decision: exclude
    why: 'ANS TISS outpatient remuneration model: outpatient care, not craniectomy.'
  field:inmet:climate:
    decision: exclude
    why: 'Climate by municipality: t03''s outcomes are where craniectomy is done (accredited or not), 30- and 90-day death and cranioplasty by person; trauma and stroke
      may vary by season, but the study does not model month, and climate does not enter where or how a craniectomy is done.'
  field:brdwgd:gaussian:
    decision: exclude
    why: 'Climate by municipality: t03''s outcomes are where craniectomy is done (accredited or not), 30- and 90-day death and cranioplasty by person; trauma and stroke
      may vary by season, but the study does not model month, and climate does not enter where or how a craniectomy is done.'
