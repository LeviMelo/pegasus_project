# abnc_t03: written by `pegasus study new`; every key is described in the README and ARCHITECTURE §3.1.
study: abnc_t03
topic:
  seeds:                       # the topic: ICD-10 codes (any level), SINAN agravos, label terms
    sigtap: ["0403010020"]
period: 2012-2024               # first-last year
where: BR                    # BR, states (AL or 27, several as a list) or municipality codes
depth: standard               # survey, standard, deep or exhaustive: presets of the choices below
# related: 3                   # related codes read beside the topic's own, strongest first (0: none)
# persons: true                # the cohort scan over linked persons (deep and exhaustive)
# download: 10                 # gigabytes the study may download (years held in the lake are free)
contexts: [households_sewer_network_comparable, persons_15_plus_literate, persons_low_income, gdp, population_urban, population_resident_census, ans_beneficiaries, cnes_neurosurgeons_professionals, cnes_beds_neurosurgery_sus, cnes_beds_icu_sus, cnes_equipment_ct_sus]   # decided 2026-11-23 (contexts_considered below); IPCA via price_index
# hypotheses:                  # declared tests, e.g. an outbreak or a relation with its lags
#   - {component: transient, where: [431690], when: 2018, note: a documented outbreak}
# every context candidate decided from what its group holds (abnc2027_neuro papers/t03/contexts_considered.yml)
line: abnc_neuro
contexts_considered:
  intake:ans:
    decision: include
    why: 'Used: private medical-hospital beneficiaries (field ans_beneficiaries, December, municipality) over POPSVS, the private-coverage covariate of the mortality and cranioplasty models (lib/covariates.py).'
  intake:ans_tiss_hosp_cons:
    decision: exclude
    why: TISS hospital events carry no procedure code, so private craniectomies stay unseen; private coverage already enters as ans_beneficiaries; not used.
  intake:siops_municipal:
    decision: exclude
    why: 'Municipal health spending and tax-base indicators (SIOPS, municipality grain): public financing, not neurosurgical supply; the paper measures supply directly from CNES (neurosurgeons, neurosurgery and ICU beds, CT scanners) and wealth from GDP and census income, so no SIOPS field is read.'
  sidra:AA:Acidentes, violência e segurança:
    decision: exclude
    why: 'National School Health Survey (Acidentes, violência e segurança): pupils aged about 13-17 in schools; craniectomy patients are adults with a median age of 50.'
  sidra:AA:Segurança:
    decision: exclude
    why: 'National School Health Survey (Segurança): pupils aged about 13-17 in schools; craniectomy patients are adults with a median age of 50.'
  sidra:B5:Furto e roubo:
    decision: exclude
    why: 'PNAD Contínua (Furto e roubo): sample survey at state grain; income and deprivation are carried by census 2022 low-income share and GDP per capita at municipal grain.'
  sidra:C2:Boa saúde e bem-estar:
    decision: exclude
    why: SDG health indicators (cardiovascular, cancer, diabetes and respiratory mortality, road-traffic mortality, maternal and under-5 mortality, and others), state grain; none concerns decompressive craniectomy, and the paper reads its deaths through SIM ill-defined and garbage-code shares.
  sidra:C2:Paz, justiça e instituições eficazes:
    decision: exclude
    why: Homicide victims per 100,000, state grain; violence enters the paper only through the craniectomy's trauma indication, not as a covariate.
  sidra:CD:Características do domicílio:
    decision: include
    why: 'Used: census 2022 sewer-network share of households (pegasus_data households_sewer_network_comparable over households), a municipal deprivation context; the other household fields are not read.'
  sidra:CD:Educação:
    decision: include
    why: 'Used: census 2022 literacy of persons 15 or more (persons_15_plus_literate over persons_15_plus), a municipal context covariate.'
  sidra:CD:Pessoas:
    decision: include
    why: 'Used: census 2022 urban share (population_urban over population_resident_census), the urbanisation covariate of the models; the age tables are not read, age enters at patient level.'
  sidra:CD:Rendimento:
    decision: include
    why: 'Used: census 2022 low-income share (persons_low_income over persons_income_universe), the municipal income covariate behind the income tertile of the mortality and cranioplasty models.'
  sidra:IA:Índices de preços:
    decision: include
    why: 'Used: monthly IPCA through pegasus_data price_index (reference December 2024) to deflate the stay payment (paid_real) in the cost trend; a deflator, not a place context.'
  sidra:IO:Contas Nacionais e Regionais:
    decision: include
    why: 'Used: municipal GDP per capita (field gdp over POPSVS), an economic-activity context covariate in lib/covariates.py.'
  sidra:IU:Coeficiente de mortalidade por homicídios ou por acidentes de transporte:
    decision: exclude
    why: Mortality from homicide and land transport accidents, state grain, 1992-2012; it ends in the first study year and the paper does not model traumatic cause-specific mortality as a covariate (trauma enters through the craniectomy's indication).
  sidra:PC:Índices de preços:
    decision: exclude
    why: 'National consumer price index series (INPC or IPCA-15): no municipal grain; the deflator in use is the IPCA (sidra:IA through price_index).'
  sidra:XN:Acidentes:
    decision: exclude
    why: 'National Health Survey 2013/2019 (traffic and work accidents, helmet and seat-belt use): self-reported, two waves, Federation-unit grain; trauma burden by place comes from SIH and SIM external-cause codes, which this paper already links.'
  sidra:XN:Doenças crônicas:
    decision: exclude
    why: 'National Health Survey self-reported chronic disease (hypertension, diabetes, stroke): sampled, two waves, state grain; stroke burden by place is read from SIH and SIM instead.'
  sidra:XN:Idosos:
    decision: exclude
    why: 'National Health Survey older adults: sample, two waves, coarse geography; the cohort''s median age is 50 and age enters at patient level.'
  sidra:XN:Uso de serviço de saúde:
    decision: exclude
    why: 'National Health Survey self-reported service use: sample, two waves; admissions are in SIH and neurosurgical supply in CNES.'
  sidra:XN:Uso de álcool:
    decision: exclude
    why: 'National Health Survey alcohol use: self-reported, two waves, state grain; cannot give health-region prevalence for a mortality contrast.'
  sidra:XN:Violência:
    decision: exclude
    why: 'National Health Survey 2013 interpersonal violence: single wave, sample, state grain; assault enters through the S0x and external-cause codes of the stays.'
  field:cnes:professionals:
    decision: include
    why: 'SUS-linked neurosurgeons per 100,000 in the health region of residence (field cnes_neurosurgeons_professionals, already a context): supply term in the model of surgery outside the accredited network (analysis/t03_supply.py) and in the patient context (lib/context). The family''s other professions do not bear on who can do a craniectomy.'
  field:cnes:equipment:
    decision: include
    why: 'SUS CT scanners per 100,000 in the health region of residence (field cnes_equipment_ct_sus, already a context): diagnosis of the indications (head injury, stroke) needs CT, so CT access enters the model of surgery outside the accredited network (analysis/t03_supply.py). MRI and the other equipment do not bear on it.'
  field:cnes:beds:
    decision: include
    why: 'SUS ICU and neurosurgery beds per 100,000 in the health region of residence (fields cnes_beds_icu_sus, cnes_beds_neurosurgery_sus, already contexts): supply terms in the model of surgery outside the accredited network (analysis/t03_supply.py); craniectomy needs intensive care after surgery.'
  field:records:SIM-DO:
    decision: include
    why: 'Deaths by residence and certification quality (fields sim_deaths_residence, sim_deaths_ill_defined, sim_deaths_garbage_codes): the paper reads SIM head-injury deaths outside hospital by region (selection before admission) and links deaths after discharge; the ill-defined and garbage shares by region are set beside that contrast (analysis/t03_supply.py).'
  field:cnes:facilities:
    decision: exclude
    why: 'Counts of SUS and non-SUS facilities by municipality: the hospitals that operate are observed directly from the AIHs, with their accreditation and volume; a count of all facilities does not measure surgical capacity.'
  field:cnes:radiotherapy_machines:
    decision: exclude
    why: 'Radiotherapy machines: oncology supply; tumour indications are excluded from the main contrasts.'
  field:intake:ans_tiss_hospital_items:
    decision: exclude
    why: 'ANS TISS hospital items by procedure: private-plan prices; t03''s private context is plan coverage (ans_beneficiaries) and CIHA admissions outside SUS funding, not item values.'
  field:inmet:climate:
    decision: exclude
    why: 'Climate by municipality: t03''s outcomes are where craniectomy is done (accredited or not), 30- and 90-day death and cranioplasty by person; trauma and stroke may vary by season, but the study does not model month, and climate does not enter where or how a craniectomy is done.'
  field:brdwgd:gaussian:
    decision: exclude
    why: 'Climate by municipality: t03''s outcomes are where craniectomy is done (accredited or not), 30- and 90-day death and cranioplasty by person; trauma and stroke may vary by season, but the study does not model month, and climate does not enter where or how a craniectomy is done.'
  field:brdwgd:climate_monthly:
    decision: exclude
    why: 'Climate by municipality: t03''s outcomes are where craniectomy is done (accredited or not), 30- and 90-day death and cranioplasty by person; trauma and stroke may vary by season, but the study does not model month, and climate does not enter where or how a craniectomy is done.'
  field:brdwgd:precipitation_months:
    decision: exclude
    why: 'Climate by municipality: t03''s outcomes are where craniectomy is done (accredited or not), 30- and 90-day death and cranioplasty by person; trauma and stroke may vary by season, but the study does not model month, and climate does not enter where or how a craniectomy is done.'
  field:brdwgd:temperature_months:
    decision: exclude
    why: 'Climate by municipality: t03''s outcomes are where craniectomy is done (accredited or not), 30- and 90-day death and cranioplasty by person; trauma and stroke may vary by season, but the study does not model month, and climate does not enter where or how a craniectomy is done.'
  field:intake:ans_tiss_outpatient_items:
    decision: exclude
    why: 'Outpatient TISS items carry TUSS procedure codes without a diagnosis. Decompressive craniectomy (SIGTAP 0403010020) and cranioplasty are inpatient operations, so an outpatient item places neither a private craniectomy nor a private reconstruction; private coverage enters as ans_beneficiaries, and non-SUS reconstruction is counted from CIHA (line S0 review R2).'
  intake:ans_tiss_amb_cons:
    decision: exclude
    why: 'Consolidated outpatient TISS events by the beneficiary''s municipality hold no diagnosis and no inpatient procedure; t03''s outcomes (where the operation is done, death, reconstruction in a later stay) are inpatient, so the outpatient setting gives no numerator (line S0 review R2).'
  field:cnes:teams:
    decision: exclude
    why: 'Primary-care team coverage (ESF, eAB/eAP) measures first contact. Craniectomy follows an emergency (TBI, stroke, haemorrhage) that enters through emergency services, not primary care; the return for cranial reconstruction is a referral from the operating neurosurgical service, which the reconstruction model carries through the operating hospital''s network, distance to the nearest accredited unit and the CNES neurosurgical supply fields. No t03 claim places a deficit before admission (line S0 review R3).'
  sidra:RC:Óbitos:
    decision: exclude
    why: 'Civil-registry deaths give a SIM coverage ratio for population death counts. t03 counts no population deaths as a need proxy: its deaths are of operated persons, in the stay (recorded on the AIH, no certificate needed) or through the certificate link, and the link''s regional ascertainment is measured directly (in-hospital deaths found by the link, by region; link-only deaths and their chance share), a finer check than a registry ratio (line S0 review R5).'
  intake:srag:
    decision: exclude
    why: 'SIVEP-Gripe ICU notifications measure pandemic strain on ICU capacity. t03 makes no claim that attributes a 2020-2021 change in craniectomy volume, accreditation share or mortality to ICU strain; the trend analyses carry the period through the year terms (line S0 review R7).'
