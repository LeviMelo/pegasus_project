# abnc_t03: written by `pegasus study new`; every key is described in the README and ARCHITECTURE §3.1.
study: abnc_t03
topic:
  seeds:                       # the topic: ICD-10 codes (any level), SINAN agravos, label terms
    sigtap: ["0403010020"]
period: 2012-2024               # first-last year
where: BR                    # BR, states (AL or 27, several as a list) or municipality codes
depth: standard               # survey, standard, deep or exhaustive: presets of the choices below
# related: 3                   # related codes read beside the topic's own, strongest first (0: none)
# persons: true                # the cohort scan over linked persons (deep and exhaustive)
# download: 10                 # gigabytes the study may download (years held in the lake are free)
contexts: [households_sewer_network_comparable, persons_15_plus_literate, persons_low_income, gdp, population_urban, population_resident_census, ans_beneficiaries, cnes_neurosurgeons_professionals, cnes_beds_neurosurgery_sus, cnes_beds_icu_sus, cnes_equipment_ct_sus]   # decided 2026-11-23 (contexts_considered below); IPCA via price_index
# hypotheses:                  # declared tests, e.g. an outbreak or a relation with its lags
#   - {component: transient, where: [431690], when: 2018, note: a documented outbreak}
# every context candidate decided from what its group holds (abnc2027_neuro papers/t03/contexts_considered.yml)
contexts_considered:
  intake:ans:
    decision: include
    why: 'Used: private medical-hospital beneficiaries (field ans_beneficiaries, December, municipality) over POPSVS, the private-coverage covariate of the mortality
      and cranioplasty models (lib/covariates.py).'
  intake:ans_beneficiaries_municipal:
    decision: exclude
    why: 'Quarterly ANS beneficiary counts by municipality: the December stock (ans_beneficiaries) already carries private coverage; not used.'
  intake:ans_tiss_amb_cons:
    decision: exclude
    why: 'ANS TISS private outpatient events by provider UF: no procedure or imaging code, so private CT supply or use cannot be identified; the hospital events (ans_tiss_hosp_cons)
      hold the private comparison.'
  intake:ans_tiss_hosp_cons:
    decision: exclude
    why: TISS hospital events carry no procedure code, so private craniectomies stay unseen; private coverage already enters as ans_beneficiaries; not used.
  intake:bnafar:
    decision: exclude
    why: 'Medicine stock positions (BNAFAR/Horus) by CNES and municipality from 2025: pharmaceutical stock, not neurosurgical supply, and outside 2012-2024.'
  intake:census2010_domicilios:
    decision: exclude
    why: 'Census 2010 household microdata: housing context a decade before the end of the period; the census 2022 tables are the covariates in use.'
  intake:census2010_emigracao:
    decision: exclude
    why: 'Census 2010 international emigrants: migration flow, no bearing on craniectomy or reconstruction.'
  intake:census2010_mortalidade:
    decision: exclude
    why: 'Census 2010 deaths of household members: self-reported household deaths, superseded by SIM and the linked certificates.'
  intake:census2010_pessoas:
    decision: exclude
    why: 'Census 2010 person microdata: a 2010 baseline superseded by census 2022 income, literacy and urban share, which fall inside the study period.'
  intake:health_regions:
    decision: include
    why: 'Used: municipality to health region and macroregion crosswalk, the grain of the regional contrasts, the health-region random intercept, the outside-home-region
      flag and the per-100,000 supply denominators.'
  intake:inep:
    decision: exclude
    why: 'INEP school census enrolments: schooling of children and adolescents, not a determinant of neurosurgical access.'
  intake:pni_doses:
    decision: exclude
    why: 'National immunisation programme doses by residence: vaccination coverage, no pathway to craniectomy.'
  intake:s2id:
    decision: exclude
    why: 'Civil-defence disaster damage records: rare municipal events, not a systematic demand or access variable for a national cohort.'
  intake:sies:
    decision: exclude
    why: 'Strategic-input distribution (vaccines, serums): immunisation logistics, no bearing on this operation.'
  intake:siops_municipal:
    decision: exclude
    why: 'Municipal health spending and tax-base indicators (SIOPS, municipality grain): public financing, not neurosurgical supply; the paper measures supply directly
      from CNES (neurosurgeons, neurosurgery and ICU beds, CT scanners) and wealth from GDP and census income, so no SIOPS field is read.'
  intake:sisagua_control_basic:
    decision: exclude
    why: 'SISAGUA drinking-water quality and supply by municipality: no plausible pathway to craniectomy or to reconstruction; sanitation context is carried by the
      census sewer share.'
  intake:sisagua_control_other:
    decision: exclude
    why: 'SISAGUA drinking-water quality and supply by municipality: no plausible pathway to craniectomy or to reconstruction; sanitation context is carried by the
