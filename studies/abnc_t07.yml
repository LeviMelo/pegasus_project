# abnc_t07: written by `pegasus study new`; every key is described in the README and ARCHITECTURE §3.1.
study: abnc_t07
topic:
  seeds:                       # the topic: ICD-10 codes (any level), SINAN agravos, label terms
    sigtap: ["0403010314", "0403010306"]
    icd10: ["I620", "S065"]
period: 2012-2024               # first-last year
where: BR                    # BR, states (AL or 27, several as a list) or municipality codes
depth: standard               # survey, standard, deep or exhaustive: presets of the choices below
# related: 3                   # related codes read beside the topic's own, strongest first (0: none)
# persons: true                # the cohort scan over linked persons (deep and exhaustive)
# download: 10                 # gigabytes the study may download (years held in the lake are free)
contexts: [households_sewer_network, persons_15_plus_literate, persons_low_income, gdp, population_urban, population_resident_census, ans_beneficiaries, ans_tiss_hospital_events_by_cid, cnes_neurosurgeons_professionals, cnes_beds_neurosurgery_sus, cnes_beds_icu_sus, cnes_equipment_ct_sus, sim_deaths_ill_defined, sim_deaths_garbage_codes, sim_deaths_residence]   # decided 2026-11-23 (contexts_considered below)
# hypotheses:                  # declared tests, e.g. an outbreak or a relation with its lags
#   - {component: transient, where: [431690], when: 2018, note: a documented outbreak}
# every context candidate decided from what its group holds (abnc2027_neuro papers/t07/contexts_considered.yml)
line: abnc_neuro
contexts_considered:
  intake:ans:
    decision: include
    why: 'Used: private medical-hospital beneficiaries (field ans_beneficiaries, December, municipality by age band by sex), the private-coverage covariate and the base of the population without private plans.'
  intake:ans_tiss_hosp_cons:
    decision: include
    why: 'Used: private-plan hospital events with the study diagnoses (fields ans_tiss_hospital_events and ans_tiss_hospital_events_by_cid), the 1,824 to 4,129 series that argues against a move of patients into the SUS.'
  intake:siops_municipal:
    decision: exclude
    why: 'Municipal health spending and tax-base indicators (SIOPS, municipality grain): public financing, not neurosurgical supply; the paper measures supply directly from CNES (neurosurgeons, neurosurgery and ICU beds, CT scanners) and wealth from GDP and census income, so no SIOPS field is read.'
  sidra:AA:Acidentes, violência e segurança:
    decision: exclude
    why: 'National School Health Survey (Acidentes, violência e segurança): pupils aged about 13-17 in schools; no older-adult content.'
  sidra:AA:Segurança:
    decision: exclude
    why: 'National School Health Survey (Segurança): pupils aged about 13-17 in schools; no older-adult content.'
  sidra:B5:Furto e roubo:
    decision: exclude
    why: 'PNAD Contínua theft and robbery victimisation: crime context, no link to this operation.'
  sidra:C2:Boa saúde e bem-estar:
    decision: exclude
    why: SDG health indicators (cardiovascular, cancer, diabetes and respiratory mortality, road-traffic mortality, maternal and under-5 mortality, and others), state grain; none concerns subdural haematoma, and the paper reads its deaths through SIM ill-defined and garbage-code shares.
  sidra:C2:Paz, justiça e instituições eficazes:
    decision: exclude
    why: Homicide victims per 100,000, state grain; violence enters the paper only through the diagnosis itself (S06.5 trauma), not as a covariate.
  sidra:CD:Características do domicílio:
    decision: include
    why: 'Used: census 2022 sewer share (pegasus_data households_sewer_network over households) as a municipal context covariate for sanitation and deprivation.'
  sidra:CD:Educação:
    decision: include
    why: 'Used: census 2022 literacy of persons 15 or more (persons_15_plus_literate over persons_15_plus), a municipal context covariate.'
  sidra:CD:Pessoas:
    decision: include
    why: 'population_urban over population_resident_census (census 2022 urban share, a municipal covariate); its age tables are not used: age enters through age-sex standardisation.'
  sidra:CD:Rendimento:
    decision: include
    why: 'Used: census 2022 low-income share (persons_low_income over persons_income_universe), the municipal income covariate behind the income tertile of the outcome models.'
  sidra:IA:Índices de preços:
    decision: exclude
    why: 'National consumer price index: a national series with no municipal grain, and costs are not analysed in this paper.'
  sidra:IO:Contas Nacionais e Regionais:
    decision: include
    why: 'Used: municipal GDP per capita (field gdp, current prices) as an economic-activity covariate.'
  sidra:IU:Coeficiente de mortalidade por homicídios ou por acidentes de transporte:
    decision: exclude
    why: Mortality from homicide and land transport accidents, state grain, 1992-2012; it ends in the first study year and the paper does not model traumatic cause-specific mortality as a covariate (trauma enters through S06.5 itself).
  sidra:PC:Índices de preços:
    decision: exclude
    why: 'National consumer price index: a national series with no municipal grain, and costs are not analysed in this paper.'
  sidra:XN:Acidentes:
    decision: exclude
    why: 'National Health Survey 2013/2019, adults 18+: seat-belt and helmet use, traffic and work accidents; no fall item (falls are the main injury of older adults), two-wave sample with coarse geography; injury context comes from SIH S06.5 and external-cause codes.'
  sidra:XN:Doenças crônicas:
    decision: exclude
    why: 'National Health Survey 2013/2019 self-reported chronic disease (385 tables on hypertension, diabetes, heart disease and others): no anticoagulant or antiplatelet table, sampled, two waves, coarse geography.'
  sidra:XN:Idosos:
    decision: exclude
    why: 'National Health Survey 2013/2019, older adults (functional limitation, care, cataract, flu vaccine): sample survey, two waves, coarse geography; the census age structure is the municipal ageing measure.'
  sidra:XN:Uso de serviço de saúde:
    decision: exclude
    why: 'National Health Survey 2013/2019 self-reported service use (admissions, visits, tests): sample survey, two waves; admissions are in SIH and imaging supply in CNES.'
  sidra:XN:Uso de álcool:
    decision: exclude
    why: 'National Health Survey 2013/2019 (alcohol use): self-reported, sampled for the Federation units and capitals, two waves; alcohol is a recognised risk factor for falls and subdural haematoma, but a two-wave sample with Federation-unit grain cannot give health-region prevalence; the SIM alcohol-related deaths are the register-based alternative if a reviewer asks.'
  sidra:XN:Violência:
    decision: exclude
    why: 'National Health Survey 2013 interpersonal violence in adults: single wave, sample; assault is a minor cause of subdural haematoma at older ages and SIH external-cause codes cover it.'
  field:cnes:professionals:
    decision: include
    why: 'Neurosurgeons per 100,000 by health region (field cnes_neurosurgeons_professionals, already a context): specialist supply in the BYM2 context model of operation rates and the CT-access regression (analysis/t07_paper.py, t07_ct.py). The family''s other professions do not bear on access to subdural surgery.'
  field:cnes:equipment:
    decision: include
    why: 'SUS CT scanners per 100,000 by health region (field cnes_equipment_ct_sus, already a context): diagnosis of chronic subdural haematoma needs CT, so CT access enters the BYM2 context model and is tested as the explanation of the low North and Northeast operation ratios (analysis/t07_ct.py). MRI and the other equipment do not bear on this diagnosis.'
  field:records:SIM-DO:
    decision: include
    why: 'Ill-defined and garbage-coded shares of deaths by residence (fields sim_deaths_ill_defined, sim_deaths_garbage_codes, sim_deaths_residence, already contexts): certification quality entered with CT access (analysis/t07_ct.py), because the need proxy rests on SIM deaths from I62.0.'
  field:cnes:beds:
    decision: include
    why: 'SUS neurosurgery and ICU beds per 100,000 by health region (fields cnes_beds_neurosurgery_sus, cnes_beds_icu_sus, already contexts) are read with the supply covariates (lib/covariates) and not entered as model terms: across the 439 health regions they correlate with neurosurgeons per 100,000 (t07_paper.json review.supply_correlation), which stands for specialist hospital supply in the models.'
  field:cnes:facilities:
    decision: exclude
    why: 'Counts of SUS and non-SUS facilities by municipality: access is measured as distance to accredited neurosurgical units, CT scanners and neurosurgeons; a count of all facilities does not measure capacity to diagnose or operate a subdural haematoma.'
  field:cnes:radiotherapy_machines:
    decision: exclude
    why: 'Radiotherapy machines: oncology supply, no bearing on subdural surgery.'
  field:intake:ans_tiss_hospital_items:
    decision: exclude
    why: 'ANS TISS hospital items by procedure: t07 uses private-plan hospital events with the study diagnoses (ans_tiss_hospital_events_by_cid) to bound private substitution; paid items and their values are not part of its question.'
  field:inmet:climate:
    decision: exclude
    why: 'Climate by municipality: t07''s outcomes are annual operation rates by health region and 30-day death and one-year reoperation of operated persons; falls in older adults may vary by season, but the study does not model month, and climate does not enter access to surgery or its outcomes at the annual regional grain.'
  field:brdwgd:gaussian:
    decision: exclude
    why: 'Climate by municipality: t07''s outcomes are annual operation rates by health region and 30-day death and one-year reoperation of operated persons; falls in older adults may vary by season, but the study does not model month, and climate does not enter access to surgery or its outcomes at the annual regional grain.'
  field:brdwgd:climate_monthly:
    decision: exclude
    why: 'Climate by municipality: t07''s outcomes are annual operation rates by health region and 30-day death and one-year reoperation of operated persons; falls in older adults may vary by season, but the study does not model month, and climate does not enter access to surgery or its outcomes at the annual regional grain.'
  field:brdwgd:precipitation_months:
    decision: exclude
    why: 'Climate by municipality: t07''s outcomes are annual operation rates by health region and 30-day death and one-year reoperation of operated persons; falls in older adults may vary by season, but the study does not model month, and climate does not enter access to surgery or its outcomes at the annual regional grain.'
  field:brdwgd:temperature_months:
    decision: exclude
    why: 'Climate by municipality: t07''s outcomes are annual operation rates by health region and 30-day death and one-year reoperation of operated persons; falls in older adults may vary by season, but the study does not model month, and climate does not enter access to surgery or its outcomes at the annual regional grain.'
