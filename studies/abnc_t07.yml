  sidra:RC:Divórcios:
    decision: exclude
    why: 'Civil-registry divorces: no bearing on this condition.'
  sidra:RC:Nascidos vivos:
    decision: exclude
    why: 'Civil-registry live births (SINASC covers births): irrelevant to an adult condition.'
  sidra:RC:Separações:
    decision: exclude
    why: 'Civil-registry separations (to 2013): no bearing on this condition.'
  sidra:RC:Óbitos:
    decision: exclude
    why: Registration completeness would bear on the I62.0 death proxy's numerator only; the under-diagnosis test uses cause specificity (sim_deaths_ill_defined,
      sim_deaths_garbage_codes) and the proxy's limits are stated; not used.
  sidra:RC:Óbitos fetais:
    decision: exclude
    why: Registration completeness would bear on the I62.0 death proxy's numerator only; the under-diagnosis test uses cause specificity (sim_deaths_ill_defined,
      sim_deaths_garbage_codes) and the proxy's limits are stated; not used.
  sidra:SB:Abastecimento de água:
    decision: exclude
    why: 'National basic sanitation survey, water supply by municipality (2000-2017): provider characteristics; the census 2022 household water and sewer shares already
      stand for sanitation.'
  sidra:SB:Esgotamento sanitário:
    decision: exclude
    why: 'National basic sanitation survey, sewerage by municipality (to 2017): provider characteristics, duplicated by the census 2022 sewer share in use.'
  sidra:SC:Serviços:
    decision: exclude
    why: Business or production survey of enterprises (monthly services revenue and volume indices), state grain; economic activity of firms is not a covariate of
      the paper, whose economic field is municipal GDP.
  sidra:SH:Hospedagem:
    decision: exclude
    why: 'Lodging survey: tourism sector, no health content.'
  sidra:SI:Construção civil:
    decision: exclude
    why: Construction costs and wages (SINAPI), state grain; no role in the paper.
  sidra:VS:Extração vegetal:
    decision: exclude
    why: 'Agricultural or forestry production (Extração vegetal): crop and extraction output, no relation to this condition.'
  sidra:VS:Silvicultura:
    decision: exclude
    why: 'Agricultural or forestry production (Silvicultura): crop and extraction output, no relation to this condition.'
  sidra:XE:Geral:
    decision: exclude
    why: IBGE 2018 population projection (population by sex and age, fertility, life expectancy), state grain, 2018 revision; the paper uses its own municipal population
      series by age band and sex for 2012-2024, finer in space.
  sidra:XF:Geral:
    decision: exclude
    why: 'IBGE estimated resident population by municipality, 2001-2026, total only: the paper takes age-sex denominators from POPSVS and the SUS-dependent product,
      which a total with no age structure cannot replace.'
  sidra:XN:Acidentes:
    decision: exclude
    why: 'National Health Survey 2013/2019, adults 18+: seat-belt and helmet use, traffic and work accidents; no fall item (falls are the main injury of older adults),
      two-wave sample with coarse geography; injury context comes from SIH S06.5 and external-cause codes.'
  sidra:XN:Alimentação:
    decision: exclude
    why: 'National Health Survey 2013/2019 (diet): self-reported, sampled for the Federation units and capitals, two waves; no pathway to subdural haematoma surgery.'
  sidra:XN:Antropometria:
    decision: exclude
    why: PNS 2013 anthropometry (height, weight, waist percentiles), state grain, a single survey year; body size has no role in the paper.
  sidra:XN:Atenção primária à saúde:
    decision: exclude
    why: PNS 2019 primary-care use and evaluation, state grain, a single year; the paper models neurosurgical access through CNES supply, not primary care.
  sidra:XN:Atividade física:
    decision: exclude
    why: 'National Health Survey 2013/2019 (physical activity): self-reported, sampled for the Federation units and capitals, two waves; no pathway to subdural haematoma
      surgery rates.'
  sidra:XN:Características do domicílio e serviços domiciliares de saúde:
    decision: exclude
    why: 'National Health Survey 2013/2019 (household characteristics and home health services): self-reported, sampled for the Federation units and capitals, two
      waves; the census 2022 household tables are municipal and cover every year of interest.'
  sidra:XN:Características do trabalho e apoio social:
    decision: exclude
    why: PNS 2019 work commuting and social support, state grain, a single year; not a covariate of the paper.
  sidra:XN:Cobertura de plano de saúde:
    decision: exclude
    why: 'National Health Survey 2013 and 2019 private coverage (by age, income, education): a sample for the Federation units and capitals, two waves; ANS administrative
      beneficiary counts, already used, cover every municipality every year.'
  sidra:XN:Deficiência:
    decision: exclude
    why: 'National Health Survey 2013 disability: single wave, sample, coarse geography; the census 2022 disability by age table (CD:Pessoas, 10131) is the municipal
      measure.'
  sidra:XN:Doenças crônicas:
    decision: exclude
    why: 'National Health Survey 2013/2019 self-reported chronic disease (385 tables on hypertension, diabetes, heart disease and others): no anticoagulant or antiplatelet
      table, sampled, two waves, coarse geography.'
  sidra:XN:Doenças transmissíveis:
    decision: exclude
    why: PNS 2019 chronic cough (tuberculosis screening), state grain, a single year; infectious, no role in the paper.
  sidra:XN:Higiene e saúde bucal:
    decision: exclude
    why: 'National Health Survey 2013/2019 (oral health): self-reported, sampled for the Federation units and capitals, two waves; no bearing on this condition.'
  sidra:XN:Idosos:
    decision: exclude
    why: 'National Health Survey 2013/2019, older adults (functional limitation, care, cataract, flu vaccine): sample survey, two waves, coarse geography; the census
      age structure is the municipal ageing measure.'
  sidra:XN:Percepção do estado de saúde:
    decision: exclude
    why: 'National Health Survey self-rated health and mobility difficulty: sample, coarse geography, no link to surgical supply.'
  sidra:XN:Saúde da mulher:
    decision: exclude
    why: 'National Health Survey 2013/2019 (women''s health screening): self-reported, sampled for the Federation units and capitals, two waves; no bearing on this
      condition.'
  sidra:XN:Tabagismo:
    decision: exclude
    why: 'National Health Survey 2013/2019 (tobacco): self-reported, sampled for the Federation units and capitals, two waves; smoking is not an established driver
      of chronic subdural haematoma and the grain is too coarse for municipal or regional models.'
  sidra:XN:Uso de serviço de saúde:
    decision: exclude
    why: 'National Health Survey 2013/2019 self-reported service use (admissions, visits, tests): sample survey, two waves; admissions are in SIH and imaging supply
      in CNES.'
  sidra:XN:Uso de álcool:
    decision: exclude
    why: 'National Health Survey 2013/2019 (alcohol use): self-reported, sampled for the Federation units and capitals, two waves; alcohol is a recognised risk factor
      for falls and subdural haematoma, but a two-wave sample with Federation-unit grain cannot give health-region prevalence; the SIM alcohol-related deaths are
      the register-based alternative if a reviewer asks.'
  sidra:XN:Vida sexual:
    decision: exclude
    why: 'National Health Survey 2013/2019 (sexual life): self-reported, sampled for the Federation units and capitals, two waves; no bearing on this condition.'
  sidra:XN:Violência:
    decision: exclude
    why: 'National Health Survey 2013 interpersonal violence in adults: single wave, sample; assault is a minor cause of subdural haematoma at older ages and SIH
      external-cause codes cover it.'
  sidra:XY:Indústria:
    decision: exclude
    why: Business or production survey of enterprises (industrial employment and wages, ends 2015), state grain; economic activity of firms is not a covariate of
      the paper, whose economic field is municipal GDP.
  field:cnes:professionals:
    decision: include
    why: 'Neurosurgeons per 100,000 by health region (field cnes_neurosurgeons_professionals, already a context): specialist supply in the BYM2 context model of operation
      rates and the CT-access regression (analysis/t07_paper.py, t07_ct.py). The family''s other professions do not bear on access to subdural surgery.'
  field:cnes:equipment:
    decision: include
    why: 'SUS CT scanners per 100,000 by health region (field cnes_equipment_ct_sus, already a context): diagnosis of chronic subdural haematoma needs CT, so CT access
      enters the BYM2 context model and is tested as the explanation of the low North and Northeast operation ratios (analysis/t07_ct.py). MRI and the other equipment
      do not bear on this diagnosis.'
  field:records:SIM-DO:
    decision: include
    why: 'Ill-defined and garbage-coded shares of deaths by residence (fields sim_deaths_ill_defined, sim_deaths_garbage_codes, sim_deaths_residence, already contexts):
      certification quality entered with CT access (analysis/t07_ct.py), because the need proxy rests on SIM deaths from I62.0.'
  field:cnes:accreditations:
    decision: include
    why: 'Neurosurgical accreditation (1601/1602): read at establishment grain from the CNES-HB records (lib/context.with_accreditation, lib/access) for distance to
      the nearest accredited unit and accreditation within hospitals, finer than this municipal field, so the field itself is not read; the oncology, stroke and other
      accreditations of the family are outside t07.'
  field:cnes:beds:
    decision: include
    why: 'SUS neurosurgery and ICU beds per 100,000 by health region (fields cnes_beds_neurosurgery_sus, cnes_beds_icu_sus, already contexts) are read with the supply
      covariates (lib/covariates) and not entered as model terms: across the 439 health regions they correlate with neurosurgeons per 100,000 (t07_paper.json review.supply_correlation),
      which stands for specialist hospital supply in the models.'
  field:cnes:specialised_services:
    decision: exclude
    why: 'CNES neurology/neurosurgery service classification by municipality: accreditation in neurosurgery (1601/1602) defines the units that may bill the subdural
      codes and is used at establishment grain; the service code adds no access information.'
  field:cnes:facilities:
    decision: exclude
    why: 'Counts of SUS and non-SUS facilities by municipality: access is measured as distance to accredited neurosurgical units, CT scanners and neurosurgeons; a count
      of all facilities does not measure capacity to diagnose or operate a subdural haematoma.'
  field:cnes:teams:
    decision: exclude
    why: 'Primary-care teams (ESF, eAB/eAP): chronic subdural haematoma reaches surgery through emergency care and CT, not through primary-care coverage; the referral
      path studied is distance and transfer to accredited units.'
  field:cnes:radiotherapy_machines:
    decision: exclude
    why: 'Radiotherapy machines: oncology supply, no bearing on subdural surgery.'
  field:intake:ans_tiss_hospital_items:
    decision: exclude
    why: 'ANS TISS hospital items by procedure: t07 uses private-plan hospital events with the study diagnoses (ans_tiss_hospital_events_by_cid) to bound private substitution;
      paid items and their values are not part of its question.'
  field:intake:ans_tiss_hospital_remuneration:
    decision: exclude
    why: 'ANS TISS remuneration model per hospital event: how plans pay providers, not whether older adults with a subdural haematoma are operated.'
  field:intake:ans_tiss_outpatient_items:
    decision: exclude
    why: 'ANS TISS outpatient items: subdural surgery is a hospital procedure; outpatient events do not bear on it.'
  field:intake:ans_tiss_outpatient_remuneration:
    decision: exclude
    why: 'ANS TISS outpatient remuneration model: outpatient care, not subdural surgery.'
  field:inmet:climate:
    decision: exclude
    why: 'Climate by municipality: t07''s outcomes are annual operation rates by health region and 30-day death and one-year reoperation of operated persons; falls
      in older adults may vary by season, but the study does not model month, and climate does not enter access to surgery or its outcomes at the annual regional grain.'
  field:brdwgd:gaussian:
    decision: exclude
    why: 'Climate by municipality: t07''s outcomes are annual operation rates by health region and 30-day death and one-year reoperation of operated persons; falls
