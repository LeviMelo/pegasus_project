# abnc_t07: written by `pegasus study new`; every key is described in the README and ARCHITECTURE §3.1.
study: abnc_t07
topic:
  seeds:                       # the topic: ICD-10 codes (any level), SINAN agravos, label terms
    sigtap: ["0403010314", "0403010306"]
    icd10: ["I620", "S065"]
period: 2012-2024               # first-last year
where: BR                    # BR, states (AL or 27, several as a list) or municipality codes
depth: standard               # survey, standard, deep or exhaustive: presets of the choices below
# related: 3                   # related codes read beside the topic's own, strongest first (0: none)
# persons: true                # the cohort scan over linked persons (deep and exhaustive)
# download: 10                 # gigabytes the study may download (years held in the lake are free)
contexts: [households_sewer_network, persons_15_plus_literate, persons_low_income, gdp, population_urban, population_resident_census, ans_beneficiaries, ans_tiss_hospital_events_by_cid, cnes_neurosurgeons_professionals, cnes_beds_neurosurgery_sus, cnes_beds_icu_sus, cnes_equipment_ct_sus, sim_deaths_ill_defined, sim_deaths_garbage_codes, sim_deaths_residence]   # decided 2026-11-23 (contexts_considered below)
# hypotheses:                  # declared tests, e.g. an outbreak or a relation with its lags
#   - {component: transient, where: [431690], when: 2018, note: a documented outbreak}
# every context candidate decided from what its group holds (abnc2027_neuro papers/t07/contexts_considered.yml)
contexts_considered:
  intake:ans:
    decision: include
    why: 'Used: private medical-hospital beneficiaries (field ans_beneficiaries, December, municipality by age band by sex), the private-coverage covariate and the
      base of the population without private plans.'
  intake:ans_beneficiaries_municipal:
    decision: exclude
    why: Private coverage by age enters through the modelled population without private coverage (by age band); the December stock (ans_beneficiaries) is the covariate;
      not used.
  intake:ans_tiss_amb_cons:
    decision: exclude
    why: 'ANS TISS private outpatient events by provider UF: columns hold CBO, consultation type and amounts but no procedure or imaging code, so private CT supply
      or use cannot be identified; the hospital events already carry the private comparison.'
  intake:ans_tiss_hosp_cons:
    decision: include
    why: 'Used: private-plan hospital events with the study diagnoses (fields ans_tiss_hospital_events and ans_tiss_hospital_events_by_cid), the 1,824 to 4,129 series
      that argues against a move of patients into the SUS.'
  intake:bnafar:
    decision: exclude
    why: 'Medicine stock positions in BNAFAR/Horus by CNES and municipality (from 2025-03): pharmaceutical stock, not neurosurgical supply, and no anticoagulant series
      for 2012-2024.'
  intake:census2010_domicilios:
    decision: exclude
    why: 'Census 2010 household microdata (housing, amenities, goods): housing context a decade before the study end; census 2022 household tables are the covariates
      in use.'
  intake:census2010_emigracao:
    decision: exclude
    why: 'Census 2010 international emigrants: migration flow, no bearing on surgery rates.'
  intake:census2010_mortalidade:
    decision: exclude
    why: 'Census 2010 deaths of household members: self-reported household deaths, superseded by SIM.'
  intake:census2010_pessoas:
    decision: exclude
    why: 'Census 2010 person microdata (age, education, income, 245 columns, municipality): a 2010 baseline superseded by census 2022 income, literacy and age structure,
      which fall inside the study period.'
  intake:health_regions:
    decision: include
    why: 'Used: municipality to health region and macroregion crosswalk (CODIGO_REGIAO_SAUDE, CODIGO_MACRORREGIAO_SAUDE), the grain of the standardised ratios, funnel
      plot and random intercepts.'
  intake:inep:
    decision: exclude
    why: 'INEP school census enrolments: schooling of children and adolescents, not an older-adult determinant.'
  intake:pni_doses:
    decision: exclude
    why: 'National immunisation programme doses by residence: vaccination coverage, no bearing on subdural haematoma surgery.'
  intake:s2id:
    decision: exclude
    why: 'Civil-defence disaster damage records (S2iD): floods, droughts and injured counts by municipality; rare events, not a systematic access or demand variable
      for a national operation rate.'
  intake:sies:
    decision: exclude
    why: 'SIES strategic-input distribution (vaccines, serums): immunisation logistics, no bearing on this condition.'
  intake:siops_municipal:
    decision: exclude
    why: 'Municipal health spending and tax-base indicators (SIOPS, municipality grain): public financing, not neurosurgical supply; the paper measures supply directly
      from CNES (neurosurgeons, neurosurgery and ICU beds, CT scanners) and wealth from GDP and census income, so no SIOPS field is read.'
  intake:sisagua_control_basic:
    decision: exclude
    why: 'SISAGUA drinking-water quality and supply by municipality: water quality and population supplied, with no plausible pathway to subdural haematoma surgery;
      sanitation context is carried by census sewer share.'
  intake:sisagua_control_other:
    decision: exclude
    why: 'SISAGUA drinking-water quality and supply by municipality: water quality and population supplied, with no plausible pathway to subdural haematoma surgery;
      sanitation context is carried by census sewer share.'
