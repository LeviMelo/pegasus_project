# The ABNc research line (abnc2027_neuro: neurosurgical conditions and procedures in the SUS, 2010-2025, Brazil):
# context decisions shared by its studies (research-workflow S0, the line's scientific cache). Each abnc_tNN
# declaration says `line: abnc_neuro` and inherits these; its own contexts_considered override them and hold only
# what its topic changes.
#
# Written 2026-11-23 by the platform session from the ten declarations' decisions: a candidate is decided here when
# every study that decided it agreed, and the reason is the line's, read from what the candidate holds (the first
# clause, from abnc_tNN.candidates.yml) and why the line's questions do not (or do) need it. Left to the studies:
# the candidates they disagree on (24) and those every deciding study excluded but a line topic plausibly needs (13:
# injury and violence indicators for traumatic brain injury and trauma; climate and season for stroke, trauma and
# falls).
#
# Corrected 2026-11-23 from the reviewer's S0 pass (papers/review_S0_line.md R1-R8): race composition and health regions
# decided here (include); ANS TISS outpatient items and consolidated outpatient events, CNES primary-care teams,
# civil-registry deaths and SIVEP-Gripe left to the studies; each reason's grain read from the candidate's own grain.
# Years between censuses: a census trait enters each year interpolated linearly per municipality between the 2010 and
# 2022 Censuses, held at 2022 afterwards; the nearest census is the sensitivity. No study puts 2022 traits on 2010 events.
#
# The line's studies: t01 aneurysm (I60, I67.1), t02 thrombectomy (I63, I64), t03 decompressive craniectomy,
# t04 spina bifida (Q05), t05 radiotherapy for malignant brain tumours (C71), t06 traumatic brain injury (S06),
# t07 chronic subdural haematoma surgery, t08 spine surgery (0408.03), t09 stereotactic radiosurgery, t10 neurosurgical
# hospital payment (0403). Their outcomes are admissions, procedures, in-hospital and linked deaths, stays and payments,
# by residence municipality and health region; denominators are POPSVS; deflation by IPCA through price_index.
line: abnc_neuro
