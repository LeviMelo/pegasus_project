# abnc_t05: written by `pegasus study new`; every key is described in the README and ARCHITECTURE §3.1.
study: abnc_t05
topic:
  seeds:                       # the topic: ICD-10 codes (any level), SINAN agravos, label terms
    icd10: ["C71"]
period: 2014-2024               # first-last year
where: BR                    # BR, states (AL or 27, several as a list) or municipality codes
depth: standard               # survey, standard, deep or exhaustive: presets of the choices below
# related: 3                   # related codes read beside the topic's own, strongest first (0: none)
# persons: true                # the cohort scan over linked persons (deep and exhaustive)
# download: 10                 # gigabytes the study may download (years held in the lake are free)
contexts: auto                 # municipal contexts related to the rates (auto: every declared one)
# hypotheses:                  # declared tests, e.g. an outbreak or a relation with its lags
#   - {component: transient, where: [431690], when: 2018, note: a documented outbreak}
# context candidates decided from what each group holds (abnc2027_neuro analysis/s2_contexts.py)
line: abnc_neuro
contexts_considered:
  sidra:CD:Características do domicílio:
    decision: exclude
    why: 'Census 2022 ''Características do domicílio'' tables (as named by IBGE): not in this paper''s models: socioeconomic position enters as the Census low-income share (and literacy where used), urbanisation as the urban share, both included from their own groups, and age enters through standardisation'
  sidra:CD:Educação:
    decision: exclude
    why: 'Census 2022 ''Educação'' tables (as named by IBGE): not in this paper''s models: socioeconomic position enters as the Census low-income share (and literacy where used), urbanisation as the urban share, both included from their own groups, and age enters through standardisation'
  sidra:CD:Pessoas:
    decision: include
    why: residence covariate of the delay model's sensitivity analysis (urban share; lib/covariates.py), built from the declared fields population_resident_census, population_urban
  sidra:CD:Rendimento:
    decision: include
    why: residence covariate of the delay model's sensitivity analysis (low-income share; lib/covariates.py), built from the declared fields persons_income_universe, persons_low_income
  sidra:XN:Acidentes:
    decision: exclude
    why: 'PNS accidents, alcohol, violence, older adults'' limitations, service use and chronic diseases by state: not on the pathway of radiotherapy timing for malignant brain tumours in this paper'
  sidra:XN:Doenças crônicas:
    decision: exclude
    why: 'PNS accidents, alcohol, violence, older adults'' limitations, service use and chronic diseases by state: not on the pathway of radiotherapy timing for malignant brain tumours in this paper'
  sidra:XN:Idosos:
    decision: exclude
    why: 'PNS accidents, alcohol, violence, older adults'' limitations, service use and chronic diseases by state: not on the pathway of radiotherapy timing for malignant brain tumours in this paper'
  sidra:XN:Uso de serviço de saúde:
    decision: exclude
    why: 'PNS accidents, alcohol, violence, older adults'' limitations, service use and chronic diseases by state: not on the pathway of radiotherapy timing for malignant brain tumours in this paper'
  sidra:XN:Uso de álcool:
    decision: exclude
    why: 'PNS accidents, alcohol, violence, older adults'' limitations, service use and chronic diseases by state: not on the pathway of radiotherapy timing for malignant brain tumours in this paper'
  sidra:XN:Violência:
    decision: exclude
    why: 'PNS accidents, alcohol, violence, older adults'' limitations, service use and chronic diseases by state: not on the pathway of radiotherapy timing for malignant brain tumours in this paper'
  sidra:AA:Segurança:
    decision: exclude
    why: 'PeNSE: behaviours of 9th-grade schoolchildren, not the population of radiotherapy timing for malignant brain tumours'
  sidra:B5:Furto e roubo:
    decision: exclude
    why: 'PNAD Contínua labour, income, housing, disability and victimisation by state: income and work are carried by the declared Census fields at municipal grain'
  sidra:IO:Contas Nacionais e Regionais:
    decision: exclude
    why: 'municipal GDP and gross value added: socioeconomic position enters as the Census low-income share, the measure closest to a patient''s means of travel and paying out of pocket'
  sidra:PC:Índices de preços:
    decision: exclude
    why: 'national price indices: used as deflators through pegasus_data price_index, not as a place context'
  sidra:IA:Índices de preços:
    decision: exclude
    why: 'national price indices: used as deflators through pegasus_data price_index, not as a place context'
  sidra:C2:Boa saúde e bem-estar:
    decision: exclude
    why: an SDG air-quality indicator (particulate level) for urban areas, not by municipality and year
  sidra:C2:Paz, justiça e instituições eficazes:
    decision: exclude
    why: an SDG air-quality indicator (particulate level) for urban areas, not by municipality and year
  intake:ans:
    decision: include
    why: residence covariate of the delay model's sensitivity analysis (private-plan coverage share; lib/covariates.py), built from the declared fields ans_beneficiaries
  intake:ans_tiss_hosp_cons:
    decision: exclude
    why: private-plan hospital events carry no person identifier and no radiotherapy course, so they cannot join the SUS radiotherapy cohort; patients who leave for private radiotherapy are represented by the private-plan coverage share, which is included
  intake:siops_municipal:
    decision: exclude
    why: 'SIOPS municipal health spending (total, own resources, personnel, SUS transfers): radiotherapy is a federal APAC payment to regional CACON/UNACON centres, so the residence''s spending does not buy the course whose start is measured; the centre (cluster and random effect) carries the provider side'
  field:brdwgd:gaussian:
    decision: exclude
    why: 'weather and climate: no pathway from temperature or rain to the scheduling of a radiotherapy course over the study years; seasonality is absorbed by the year term'
  field:intake:ans_tiss_hospital_items:
    decision: exclude
    why: private-plan billing items carry no person identifier and cannot join the SUS radiotherapy cohort; private coverage enters as the municipal share, included
  field:inmet:climate:
    decision: exclude
    why: 'weather and climate: no pathway from temperature or rain to the scheduling of a radiotherapy course over the study years; seasonality is absorbed by the year term'
  field:brdwgd:climate_monthly:
    decision: exclude
    why: 'weather and climate: no pathway from temperature or rain to the scheduling of a radiotherapy course over the study years; seasonality is absorbed by the year term'
  field:cnes:beds:
    decision: exclude
    why: 'inpatient beds: radiotherapy is an outpatient course, and the surgical step is represented by neurosurgeons and neurosurgical accreditation, included'
  field:cnes:radiotherapy_machines:
    decision: include
    why: linear accelerators per million of the patient's health region and at the centre's municipality (sections supply, crosssite, supply_neuro); cobalt and brachytherapy units are not used for brain tumours
  field:cnes:professionals:
    decision: include
    why: neurosurgeons per million of the patient's health region and SUS radiotherapist hours (sections supply, supply_neuro); the other professions lie off the radiotherapy pathway
  field:cnes:equipment:
    decision: include
    why: 'SUS MRI and CT scanners per million of the patient''s health region: planning imaging before radiotherapy (section supply_neuro); dialysis, EEG, hemodynamics and mammography lie off the pathway'
  field:cnes:facilities:
    decision: exclude
    why: 'counts of hospitals, clinics and primary care units: capacity on the radiotherapy pathway is measured by accelerators, radiotherapist hours and accreditations, included'
  field:sidra:pns_violence_by_stranger:
    decision: exclude
    why: 'violence by strangers (PNS): no pathway to radiotherapy timing'
  field:sidra:pns_violence_by_stranger_percent:
    decision: exclude
    why: as above
  field:brdwgd:precipitation_months:
    decision: exclude
    why: 'weather and climate: no pathway from temperature or rain to the scheduling of a radiotherapy course over the study years; seasonality is absorbed by the year term'
  field:records:SIM-DO:
    decision: exclude
    why: certification quality (ill-defined and garbage-code shares) bears only on the supplementary courses-per-death ratio, which is reported as context, not as a claim; the paper's outcome is the APAC interval
  field:brdwgd:temperature_months:
    decision: exclude
    why: 'weather and climate: no pathway from temperature or rain to the scheduling of a radiotherapy course over the study years; seasonality is absorbed by the year term'
  cnes_linear_accelerators:
    decision: include
    why: 'municipal covariate, December of each patient''s year 2014-2023 (CNES): linear accelerators per million residents of the patient''s health region, and at the treating centre''s municipality (section supply): capacity as a driver of delay'
  cnes_radiotherapists_hours_sus:
    decision: include
    why: 'municipal covariate, December of each patient''s year 2014-2023 (CNES): SUS radiotherapist hours per million residents of the patient''s health region (section supply): staffing as a driver of delay'
  cnes_accreditation_oncology_cacon:
    decision: include
    why: 'municipal covariate, December of each patient''s year 2014-2023 (CNES): any CACON at the treating centre''s municipality, counted apart from the radiotherapy accreditations (section supply)'
  cnes_accreditation_radiotherapy:
    decision: include
    why: 'municipal covariate, December of each patient''s year 2014-2023 (CNES): any radiotherapy accreditation at the treating centre''s municipality (section supply)'
  cnes_accreditation_oncology_unacon:
    decision: include
    why: 'municipal covariate, December of each patient''s year 2014-2023 (CNES): UNACON counts reported beside the national supply (section supply)'
  cnes_equipment_mri_sus:
    decision: include
    why: 'municipal covariate, December of each patient''s year 2014-2023 (CNES): SUS MRI scanners per million residents of the patient''s health region: planning imaging before radiotherapy (section supply_neuro, sensitivity)'
  cnes_equipment_ct_sus:
    decision: include
    why: 'municipal covariate, December of each patient''s year 2014-2023 (CNES): SUS CT scanners per million residents of the patient''s health region: planning imaging (section supply_neuro, sensitivity)'
  cnes_neurosurgeons_professionals:
    decision: include
    why: 'municipal covariate, December of each patient''s year 2014-2023 (CNES): neurosurgeons per million residents of the patient''s health region: the surgical step before radiotherapy (section supply_neuro, sensitivity)'
  cnes_accreditation_neuro_high_complexity:
    decision: include
    why: 'municipal covariate, December of each patient''s year 2014-2023 (CNES): any high-complexity neurosurgical accreditation at the treating centre''s municipality (section supply_neuro, sensitivity)'
  field:intake:ans_tiss_outpatient_items:
    decision: exclude
    why: "t05 is certified (S5) and was not reopened by the line's S0 review: its claims are the SUS timeliness of radiotherapy for malignant brain tumours, from the pathology report to the planned start, which this group does not bear on (papers/review_S0_line.md R2); the decision every study made before the line left it to them."
