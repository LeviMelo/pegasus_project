    decision: include
    why: CACON, UNACON, radiotherapy and high-complexity neurosurgical accreditation at the centre's municipality
      (sections supply, supply_neuro); stroke, thrombectomy and neuro reference-centre accreditations lie off the
      radiotherapy pathway
  field:cnes:beds:
    decision: exclude
    why: 'inpatient beds: radiotherapy is an outpatient course, and the surgical step is represented by neurosurgeons
      and neurosurgical accreditation, included'
  field:cnes:radiotherapy_machines:
    decision: include
    why: linear accelerators per million of the patient's health region and at the centre's municipality (sections
      supply, crosssite, supply_neuro); cobalt and brachytherapy units are not used for brain tumours
  field:cnes:professionals:
    decision: include
    why: neurosurgeons per million of the patient's health region and SUS radiotherapist hours (sections supply,
      supply_neuro); the other professions lie off the radiotherapy pathway
  field:cnes:equipment:
    decision: include
    why: 'SUS MRI and CT scanners per million of the patient''s health region: planning imaging before radiotherapy
      (section supply_neuro); dialysis, EEG, hemodynamics and mammography lie off the pathway'
  field:cnes:facilities:
    decision: exclude
    why: 'counts of hospitals, clinics and primary care units: capacity on the radiotherapy pathway is measured
      by accelerators, radiotherapist hours and accreditations, included'
  field:cnes:specialised_services:
    decision: exclude
    why: registered neurology-neurosurgery services carry no capacity measure; the neurosurgical step enters as
      neurosurgeons and high-complexity accreditation, included
  field:cnes:teams:
    decision: exclude
    why: family-health and primary-care teams act before diagnosis; the interval starts at the pathological diagnosis,
      after that stage
