    why: "t05 is certified (S5) and was not reopened by the line's S0 review: its claims are the SUS timeliness of radiotherapy for malignant brain tumours, from the pathology report to the planned start, which this group does not bear on (papers/review_S0_line.md R5); the decision every study made before the line left it to them."
