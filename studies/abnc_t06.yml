# abnc_t06: written by `pegasus study new`; every key is described in the README and ARCHITECTURE §3.1.
study: abnc_t06
topic:
  seeds:                       # the topic: ICD-10 codes (any level), SINAN agravos, label terms
    icd10: ["S06"]
period: 2015-2024               # first-last year
where: BR                    # BR, states (AL or 27, several as a list) or municipality codes
depth: standard               # survey, standard, deep or exhaustive: presets of the choices below
# related: 3                   # related codes read beside the topic's own, strongest first (0: none)
# persons: true                # the cohort scan over linked persons (deep and exhaustive)
# download: 10                 # gigabytes the study may download (years held in the lake are free)
contexts: auto                 # municipal contexts related to the rates (auto: every declared one)
# hypotheses:                  # declared tests, e.g. an outbreak or a relation with its lags
#   - {component: transient, where: [431690], when: 2018, note: a documented outbreak}
# context candidates decided from what each group holds (abnc2027_neuro analysis/s2_contexts.py)
line: abnc_neuro
contexts_considered:
  sidra:CD:Características do domicílio:
    decision: exclude
    why: 'Census 2022 ''Características do domicílio'' tables (as named by IBGE): not in this paper''s models: socioeconomic position enters as the Census low-income share (and literacy where used), urbanisation as the urban share, both included from their own groups, and age enters through standardisation'
  sidra:CD:Educação:
    decision: include
    why: municipal covariate of the paper's models (literacy 15+; lib/covariates.py), built from the declared fields persons_15_plus, persons_15_plus_literate
  sidra:CD:Pessoas:
    decision: include
    why: municipal covariate of the paper's models (urban share; lib/covariates.py), built from the declared fields population_resident_census, population_urban
  sidra:CD:Rendimento:
    decision: include
    why: municipal covariate of the paper's models (low-income share; lib/covariates.py), built from the declared fields persons_income_universe, persons_low_income
  sidra:XN:Acidentes:
    decision: include
    why: 'PNS helmet and seat-belt use by state: the exposure of the ecological helmet analysis (now read from a local extract, to be a declared field)'
  sidra:XN:Doenças crônicas:
    decision: exclude
    why: 'PNS accidents, alcohol, violence, older adults'' limitations, service use and chronic diseases by state: not on the pathway of traumatic brain injury in this paper'
  sidra:XN:Idosos:
    decision: include
    why: 'PNS functional limitation of older adults by state: a context of fall TBI at 75+'
  sidra:XN:Uso de serviço de saúde:
    decision: include
    why: 'PNS urgent care at home and service use by state: the only available reflection of prehospital care, which the paper cannot otherwise measure'
  sidra:XN:Uso de álcool:
    decision: include
    why: 'PNS drink-driving and heavy drinking by state: a context of road and assault TBI'
  sidra:XN:Violência:
    decision: include
    why: 'PNS experienced violence by state: a context of assault TBI'
  sidra:AA:Segurança:
    decision: exclude
    why: 'PeNSE: behaviours of 9th-grade schoolchildren, not the population of traumatic brain injury'
  sidra:B5:Furto e roubo:
    decision: exclude
    why: 'PNAD Contínua labour, income, housing, disability and victimisation by state: income and work are carried by the declared Census fields at municipal grain'
  sidra:IO:Contas Nacionais e Regionais:
    decision: exclude
    why: 'national and regional accounts: GDP per capita is already a declared municipal field'
  sidra:PC:Índices de preços:
    decision: exclude
    why: 'national price indices: used as deflators through pegasus_data price_index, not as a place context'
  sidra:IA:Índices de preços:
    decision: exclude
    why: 'national price indices: used as deflators through pegasus_data price_index, not as a place context'
  sidra:C2:Boa saúde e bem-estar:
    decision: exclude
    why: an SDG air-quality indicator (particulate level) for urban areas, not by municipality and year
  sidra:C2:Paz, justiça e instituições eficazes:
    decision: exclude
    why: an SDG air-quality indicator (particulate level) for urban areas, not by municipality and year
  intake:ans:
    decision: include
    why: municipal covariate of the paper's models (private-plan coverage share; lib/covariates.py), built from the declared fields ans_beneficiaries
  intake:ans_tiss_hosp_cons:
    decision: include
    why: private hospital TBI events (CID S06) by state (section tiss)
  intake:siops_municipal:
    decision: exclude
    why: 'SIOPS municipal health spending (total, own resources, personnel, SUS transfers): traumatic brain injury is paid by federal SUS production payment (AIH/APAC) at regional centres, which municipal spending does not measure'
  pns_helmet_motorcycle_driver_percent:
    decision: include
    why: state-grain covariate (27 units), read through load_field and used only in state-level analyses with its CI limits; PegaSUS's state-grain reading pending
