    decision: exclude
    why: 'PNAD Contínua annual (labour-market extras): household sample with Federation-unit grain at best; income and deprivation come from census 2022 and the ANS
      coverage at municipal grain.'
  sidra:B5:Características do domicílio:
    decision: exclude
    why: 'PNAD Contínua annual (household characteristics): household sample with Federation-unit grain at best; census 2022 household tables are municipal.'
  sidra:B5:Características gerais da população:
    decision: exclude
    why: 'PNAD Contínua annual (population by sex and age): household sample with Federation-unit grain at best; POPSVS gives municipal age-sex denominators, including
      residents under one year for the admission rates.'
  sidra:B5:Deficiência:
    decision: exclude
    why: 'PNAD Contínua annual (disability, 2022): household sample with Federation-unit grain at best; disability of the general population, not a covariate of a
