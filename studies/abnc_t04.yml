# abnc_t04: written by `pegasus study new`; every key is described in the README and ARCHITECTURE §3.1.
study: abnc_t04
topic:
  seeds:                       # the topic: ICD-10 codes (any level), SINAN agravos, label terms
    icd10: ["Q05"]
    sigtap: ["0403010225"]
period: 2012-2023               # first-last year
where: BR                    # BR, states (AL or 27, several as a list) or municipality codes
depth: standard               # survey, standard, deep or exhaustive: presets of the choices below
# related: 3                   # related codes read beside the topic's own, strongest first (0: none)
# persons: true                # the cohort scan over linked persons (deep and exhaustive)
# download: 10                 # gigabytes the study may download (years held in the lake are free)
contexts: [persons_low_income, population_urban, population_resident_census, ans_beneficiaries]   # decided 2026-11-23 (contexts_considered below)
# hypotheses:                  # declared tests, e.g. an outbreak or a relation with its lags
#   - {component: transient, where: [431690], when: 2018, note: a documented outbreak}
# every context candidate decided from what its group holds (abnc2027_neuro papers/t04/contexts_considered.yml)
line: abnc_neuro
contexts_considered:
  intake:ans:
    decision: include
    why: 'Used: private medical-hospital beneficiaries (field ans_beneficiaries, December, municipality, over POPSVS), the private_coverage covariate of the admission-outcome models (shunt, death within the stay) and of the BYM2 context model of admission rates (lib/covariates.py, residence municipality of the admission year; 2012-2020 take the 2021 stock, flagged).'
  intake:ans_tiss_hosp_cons:
    decision: exclude
    why: 'ANS TISS private hospital events: CID filled by group only, too sparse for Q05 and hydrocephalus in children, so private closures and shunts cannot be counted; private coverage enters as ans_beneficiaries.'
  intake:siops_municipal:
    decision: exclude
    why: 'SIOPS municipal health spending (own resources, transfers, personnel, tax base): municipal declarations that do not fund paediatric neurosurgery, which is delivered by a few state and university referral hospitals reached through the health region; supply is read from CNES and access from distance to the nearest accredited unit and the outside-region flag.'
  sidra:AA:Acidentes, violência e segurança:
    decision: exclude
    why: 'School Health Survey (PeNSE, Acidentes, violência e segurança): 9th-grade pupils aged about 13-17 in school; no data on infants, mothers at birth or pregnancy care, and not a municipal covariate of births.'
  sidra:AA:Segurança:
    decision: exclude
    why: 'School Health Survey (PeNSE, Segurança): 9th-grade pupils aged about 13-17 in school; no data on infants, mothers at birth or pregnancy care, and not a municipal covariate of births.'
  sidra:B5:Furto e roubo:
    decision: exclude
    why: 'PNAD Contínua annual (theft and robbery victimisation): household sample with Federation-unit grain at best; crime context, no link to this condition.'
  sidra:CD:Características do domicílio:
    decision: exclude
    why: 'Census 2022 household tables (water, sewer, waste, bathroom): the sewer share is built in lib/covariates.py but not read by this paper''s models; deprivation enters through the low-income and urban shares, and a sanitation pathway to neural tube closure is not established.'
  sidra:CD:Educação:
    decision: exclude
    why: Maternal schooling is modelled at the individual level from SINASC; an area literacy term would duplicate it at a coarser grain; not used.
  sidra:CD:Pessoas:
    decision: include
    why: 'Used: census 2022 urban share (population_urban over population_resident_census, municipality), a covariate of the admission-outcome models and of the BYM2 context model; the age tables are not read, infant denominators come from POPSVS.'
  sidra:CD:Rendimento:
    decision: include
    why: 'Used: census 2022 low-income share (persons_low_income over persons_income_universe, municipality), the income covariate behind the income tertile of the closure, shunt and death models and a term of the BYM2 context model.'
  sidra:IA:Índices de preços:
    decision: exclude
    why: 'National consumer price index: national series without municipal grain; costs are not analysed in this paper.'
  sidra:IO:Contas Nacionais e Regionais:
    decision: exclude
    why: 'Municipal GDP and gross value added: GDP per capita is built in lib/covariates.py but not read by this paper; the census low-income share already carries the income gradient and the two are strongly collinear.'
  sidra:PC:Índices de preços:
    decision: exclude
    why: 'National consumer price index: national series without municipal grain; costs are not analysed in this paper.'
  sidra:XN:Acidentes:
    decision: exclude
    why: 'National Health Survey 2013/2019 (accidents): self-reported adult sample with Federation-unit and capital grain, two waves; no pathway to spina bifida at birth or to its care.'
  sidra:XN:Doenças crônicas:
    decision: exclude
    why: 'National Health Survey 2013/2019 (chronic disease): self-reported adult sample with Federation-unit and capital grain, two waves; adult hypertension, diabetes and others; maternal diabetes is not a table here and SINASC does not record it.'
  sidra:XN:Idosos:
    decision: exclude
    why: 'National Health Survey 2013/2019 (older adults): self-reported adult sample with Federation-unit and capital grain, two waves; no bearing on a birth anomaly.'
  sidra:XN:Uso de serviço de saúde:
    decision: exclude
    why: 'National Health Survey 2013/2019 (service use): self-reported adult sample with Federation-unit and capital grain, two waves; admissions are in SIH and supply in CNES.'
  sidra:XN:Uso de álcool:
    decision: exclude
    why: 'National Health Survey 2013/2019 (alcohol use): self-reported adult sample with Federation-unit and capital grain, two waves; adult prevalence, not gestational exposure, and the grain cannot give health-region prevalence.'
  sidra:XN:Violência:
    decision: exclude
    why: 'National Health Survey 2013/2019 (violence): self-reported adult sample with Federation-unit and capital grain, two waves; no bearing on this condition.'
  sidra:IU:Coeficiente de mortalidade por homicídios ou por acidentes de transporte:
    decision: exclude
    why: 'Coeficiente de mortalidade por homicídios ou por acidentes de transporte (Indicadores de Desenvolvimento Sustentável), state grain: t04''s unit is the infant admitted with spina bifida and the municipality or health region of residence; its context covariates are municipal (income, private coverage, urbanisation); this group is not a covariate of the paper.'
  sidra:C2:Boa saúde e bem-estar:
    decision: exclude
    why: 'Boa saúde e bem-estar (Objetivos de Desenvolvimento Sustentável), state grain: t04''s unit is the infant admitted with spina bifida and the municipality or health region of residence; its context covariates are municipal (income, private coverage, urbanisation); this group is not a covariate of the paper.'
  sidra:C2:Paz, justiça e instituições eficazes:
    decision: exclude
    why: 'Paz, justiça e instituições eficazes (Objetivos de Desenvolvimento Sustentável), state grain: t04''s unit is the infant admitted with spina bifida and the municipality or health region of residence; its context covariates are municipal (income, private coverage, urbanisation); this group is not a covariate of the paper.'
  field:brdwgd:gaussian:
    decision: exclude
    why: 'Climate by municipality: t04''s outcomes (repair, infant death, access) are annual and by place of residence; season is not modelled and climate does not enter care after birth.'
  field:intake:ans_tiss_hospital_items:
    decision: exclude
    why: 'Private-plan item prices: t04''s private context is plan coverage, not prices.'
  field:inmet:climate:
    decision: exclude
    why: 'Climate by municipality: t04''s outcomes (repair, infant death, access) are annual and by place of residence; season is not modelled and climate does not enter care after birth.'
  field:brdwgd:climate_monthly:
    decision: exclude
    why: 'Climate by municipality: t04''s outcomes (repair, infant death, access) are annual and by place of residence; season is not modelled and climate does not enter care after birth.'
  field:cnes:beds:
    decision: exclude
    why: 'Beds, neonatal ICU beds included: neonatal intensive care could bear on infant survival, but t04 compares infant death by region, hospital volume and accreditation, not by bed supply; stated in the data extent as available and not used.'
  field:cnes:radiotherapy_machines:
    decision: exclude
    why: 'Radiotherapy machines: oncology supply, no bearing on spina bifida.'
  field:cnes:professionals:
    decision: exclude
    why: 'Neurosurgeons per resident were declared but are not modelled: access is measured as distance to an accredited unit and care outside the home region, and hospital capacity as volume; supply counts per resident would add an ecological term the infant-level models do not need.'
  field:cnes:equipment:
    decision: exclude
    why: 'CT and other equipment: spina bifida is diagnosed at birth by examination (and before birth by ultrasound), so CT supply does not bear on access to repair.'
  field:cnes:facilities:
    decision: exclude
    why: 'Facility counts by municipality: the hospitals that treat these infants are observed directly from the AIHs, with accreditation and volume.'
  field:brdwgd:precipitation_months:
    decision: exclude
    why: 'Climate by municipality: t04''s outcomes (repair, infant death, access) are annual and by place of residence; season is not modelled and climate does not enter care after birth.'
  field:records:SIM-DO:
    decision: include
    why: SIM infant deaths (and SIM-DOFET foetal deaths) are read at record level for infant mortality, the Q05 underlying-cause deaths and the birth-death linkage (analysis/t04_infant.py, t04_fetal.py, t04_link_age.py); the municipal certification-quality fields of this family are not read.
  field:brdwgd:temperature_months:
    decision: exclude
    why: 'Climate by municipality: t04''s outcomes (repair, infant death, access) are annual and by place of residence; season is not modelled and climate does not enter care after birth.'
