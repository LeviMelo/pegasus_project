  field:brdwgd:gaussian:
    decision: exclude
    why: 'Climate by municipality: t04''s outcomes (repair, infant death, access) are annual and by place of residence; season is not modelled and climate does not
      enter care after birth.'
  field:intake:ans_tiss_hospital_items:
    decision: exclude
    why: 'Private-plan item prices: t04''s private context is plan coverage, not prices.'
  field:intake:ans_tiss_hospital_remuneration:
    decision: exclude
    why: 'Private-plan remuneration model per event: not part of the question.'
  field:intake:ans_tiss_outpatient_items:
    decision: exclude
    why: 'Private-plan outpatient items: the cohort is hospital admissions.'
  field:intake:ans_tiss_outpatient_remuneration:
    decision: exclude
    why: 'Private-plan outpatient remuneration model: not part of the question.'
  field:inmet:climate:
    decision: exclude
    why: 'Climate by municipality: t04''s outcomes (repair, infant death, access) are annual and by place of residence; season is not modelled and climate does not
      enter care after birth.'
  field:brdwgd:climate_monthly:
    decision: exclude
    why: 'Climate by municipality: t04''s outcomes (repair, infant death, access) are annual and by place of residence; season is not modelled and climate does not
      enter care after birth.'
  field:cnes:accreditations:
    decision: include
    why: 'Neurosurgical accreditation (CNES-HB 1601/1602): the distance from residence to the nearest accredited unit and the treating hospital''s status, read at establishment
      grain from the CNES-HB records (lib/access, lib/context), finer than this municipal field; the other accreditations of the family are outside t04.'
  field:cnes:beds:
    decision: exclude
    why: 'Beds, neonatal ICU beds included: neonatal intensive care could bear on infant survival, but t04 compares infant death by region, hospital volume and accreditation,
      not by bed supply; stated in the data extent as available and not used.'
  field:cnes:radiotherapy_machines:
    decision: exclude
    why: 'Radiotherapy machines: oncology supply, no bearing on spina bifida.'
  field:cnes:professionals:
    decision: exclude
    why: 'Neurosurgeons per resident were declared but are not modelled: access is measured as distance to an accredited unit and care outside the home region, and
      hospital capacity as volume; supply counts per resident would add an ecological term the infant-level models do not need.'
  field:cnes:equipment:
    decision: exclude
    why: 'CT and other equipment: spina bifida is diagnosed at birth by examination (and before birth by ultrasound), so CT supply does not bear on access to repair.'
  field:cnes:facilities:
    decision: exclude
    why: 'Facility counts by municipality: the hospitals that treat these infants are observed directly from the AIHs, with accreditation and volume.'
  field:cnes:specialised_services:
    decision: exclude
    why: 'Neurology/neurosurgery service classification: accreditation (1601/1602) defines the network and is used.'
  field:cnes:teams:
    decision: exclude
    why: 'Primary-care teams: prenatal care bears on prevention and prenatal diagnosis, which t04 does not study; its cohort starts at the admission after birth.'
  field:sidra:persons_10_plus:
    decision: exclude
    why: 'Census persons aged 10 and over: not a covariate; the cohort is infants and the context is municipal income, coverage and urbanisation.'
  field:sidra:persons_10_plus_literate:
    decision: exclude
    why: 'Census literacy at 10 and over: not a covariate of an infant cohort; income and urbanisation carry the municipal context.'
  field:brdwgd:precipitation_months:
    decision: exclude
    why: 'Climate by municipality: t04''s outcomes (repair, infant death, access) are annual and by place of residence; season is not modelled and climate does not
      enter care after birth.'
  field:records:SIM-DO:
    decision: include
    why: SIM infant deaths (and SIM-DOFET foetal deaths) are read at record level for infant mortality, the Q05 underlying-cause deaths and the birth-death linkage
      (analysis/t04_infant.py, t04_fetal.py, t04_link_age.py); the municipal certification-quality fields of this family are not read.
  field:brdwgd:temperature_months:
    decision: exclude
    why: 'Climate by municipality: t04''s outcomes (repair, infant death, access) are annual and by place of residence; season is not modelled and climate does not
      enter care after birth.'
