  sidra:PM:Geral:
    decision: exclude
    why: 'MUNIC municipal-management survey 2020-2023, mostly 2021 cross-sections (councils, health plans, programmes): management structure, outside most of the
      birth years, not supply of neurosurgery, which CNES holds by establishment and month.'
  sidra:PM:Informações básicas municipais:
    decision: exclude
    why: 'MUNIC 2020 housing programmes and informal settlements: urban housing policy, no health content.'
  sidra:PP:Pecuária:
    decision: exclude
    why: 'Agricultural, forestry or livestock production (Pecuária): output series, no relation to spina bifida or its care.'
  sidra:RC:Casamentos:
    decision: exclude
    why: 'Civil-registry marriages: no bearing on this condition.'
  sidra:RC:Divórcios:
    decision: exclude
    why: 'Civil-registry divorces: no bearing on this condition.'
  sidra:RC:Nascidos vivos:
    decision: exclude
    why: 'Civil-registry live births by mother''s age and residence (2003-2024): SINASC is the birth source and the denominator of the prevalence (with every maternal
      field and the anomaly code); registry births by registration date would only add a second, less complete count.'
  sidra:RC:Separações:
    decision: exclude
    why: 'Civil-registry separations (to 2013): no bearing on this condition.'
  sidra:RC:Óbitos:
    decision: exclude
    why: 'Civil-registry deaths: registration completeness; infant deaths come from SIM, linked to SINASC, and the link''s loss by age at death is measured directly
      (t04_link_age).'
  sidra:RC:Óbitos fetais:
    decision: exclude
    why: 'Civil-registry fetal deaths: stillbirths with spina bifida are outside the live-born cohort, and a registry count carries no anomaly code.'
  sidra:SB:Abastecimento de água:
    decision: exclude
    why: 'National basic sanitation survey, water supply by municipality (to 2017): provider characteristics, not maternal exposure.'
  sidra:SB:Esgotamento sanitário:
    decision: exclude
    why: 'National basic sanitation survey, sewerage by municipality (to 2017): provider characteristics, with no pathway to neural tube closure.'
  sidra:SH:Hospedagem:
    decision: exclude
    why: 'Lodging survey: tourism sector, no health content.'
  sidra:VS:Extração vegetal:
    decision: exclude
    why: 'Agricultural, forestry or livestock production (Extração vegetal): output series, no relation to spina bifida or its care.'
  sidra:VS:Silvicultura:
    decision: exclude
    why: 'Agricultural, forestry or livestock production (Silvicultura): output series, no relation to spina bifida or its care.'
  sidra:XF:Geral:
    decision: exclude
    why: 'IBGE estimated resident population by municipality, total only: the infant denominators (residents under one year) need age structure, which POPSVS gives.'
  sidra:XN:Acidentes:
    decision: exclude
    why: 'National Health Survey 2013/2019 (accidents): self-reported adult sample with Federation-unit and capital grain, two waves; no pathway to spina bifida at
      birth or to its care.'
  sidra:XN:Alimentação:
    decision: exclude
    why: 'National Health Survey 2013/2019 (diet): self-reported adult sample with Federation-unit and capital grain, two waves; no folic-acid or periconceptional
      item at municipal or health-region grain; flour fortification is a national measure and enters as the time trend.'
  sidra:XN:Atividade física:
    decision: exclude
    why: 'National Health Survey 2013/2019 (physical activity): self-reported adult sample with Federation-unit and capital grain, two waves; no pathway to this condition.'
  sidra:XN:Características do domicílio e serviços domiciliares de saúde:
    decision: exclude
    why: 'National Health Survey 2013/2019 (household characteristics and home health services): self-reported adult sample with Federation-unit and capital grain,
      two waves; census 2022 household tables are municipal.'
  sidra:XN:Cobertura de plano de saúde:
    decision: exclude
    why: 'National Health Survey 2013/2019 (private coverage): self-reported adult sample with Federation-unit and capital grain, two waves; ANS beneficiary counts,
      already used, cover every municipality every year.'
  sidra:XN:Deficiência:
    decision: exclude
    why: 'National Health Survey 2013/2019 (disability): self-reported adult sample with Federation-unit and capital grain, two waves; single-wave adult self-report
      of intellectual and physical disability; this paper measures the anomaly directly and no item identifies spina bifida.'
  sidra:XN:Doenças crônicas:
    decision: exclude
    why: 'National Health Survey 2013/2019 (chronic disease): self-reported adult sample with Federation-unit and capital grain, two waves; adult hypertension, diabetes
      and others; maternal diabetes is not a table here and SINASC does not record it.'
  sidra:XN:Higiene e saúde bucal:
    decision: exclude
    why: 'National Health Survey 2013/2019 (oral health): self-reported adult sample with Federation-unit and capital grain, two waves; no bearing on this condition.'
  sidra:XN:Idosos:
    decision: exclude
    why: 'National Health Survey 2013/2019 (older adults): self-reported adult sample with Federation-unit and capital grain, two waves; no bearing on a birth anomaly.'
  sidra:XN:Percepção do estado de saúde:
    decision: exclude
    why: 'National Health Survey 2013/2019 (self-rated health): self-reported adult sample with Federation-unit and capital grain, two waves; no link to surgical
      supply or to birth outcomes.'
  sidra:XN:Saúde da mulher:
    decision: exclude
    why: 'National Health Survey 2013/2019 (women''s health: screening, menopause, ever-pregnant women by income): self-reported adult sample with Federation-unit
      and capital grain, two waves; no prenatal-care or folic-acid item (prenatal visits are read for every birth from SINASC), so it adds nothing beyond the individual
      data.'
  sidra:XN:Tabagismo:
    decision: exclude
    why: 'National Health Survey 2013/2019 (tobacco): self-reported adult sample with Federation-unit and capital grain, two waves; maternal smoking is not a table
      of pregnancy and is not an established determinant of spina bifida.'
  sidra:XN:Uso de serviço de saúde:
    decision: exclude
    why: 'National Health Survey 2013/2019 (service use): self-reported adult sample with Federation-unit and capital grain, two waves; admissions are in SIH and
      supply in CNES.'
  sidra:XN:Uso de álcool:
    decision: exclude
    why: 'National Health Survey 2013/2019 (alcohol use): self-reported adult sample with Federation-unit and capital grain, two waves; adult prevalence, not gestational
      exposure, and the grain cannot give health-region prevalence.'
  sidra:XN:Vida sexual:
    decision: exclude
    why: 'National Health Survey 2013/2019 (sexual life): self-reported adult sample with Federation-unit and capital grain, two waves; no bearing on this condition.'
  sidra:XN:Violência:
    decision: exclude
    why: 'National Health Survey 2013/2019 (violence): self-reported adult sample with Federation-unit and capital grain, two waves; no bearing on this condition.'
