# abnc_t04: written by `pegasus study new`; every key is described in the README and ARCHITECTURE §3.1.
study: abnc_t04
topic:
  seeds:                       # the topic: ICD-10 codes (any level), SINAN agravos, label terms
    icd10: ["Q05"]
    sigtap: ["0403010225"]
period: 2012-2023               # first-last year
where: BR                    # BR, states (AL or 27, several as a list) or municipality codes
depth: standard               # survey, standard, deep or exhaustive: presets of the choices below
# related: 3                   # related codes read beside the topic's own, strongest first (0: none)
# persons: true                # the cohort scan over linked persons (deep and exhaustive)
# download: 10                 # gigabytes the study may download (years held in the lake are free)
contexts: [persons_low_income, population_urban, population_resident_census, ans_beneficiaries]   # decided 2026-11-23 (contexts_considered below)
# hypotheses:                  # declared tests, e.g. an outbreak or a relation with its lags
#   - {component: transient, where: [431690], when: 2018, note: a documented outbreak}
# every context candidate decided from what its group holds (abnc2027_neuro papers/t04/contexts_considered.yml)
contexts_considered:
  intake:ans:
    decision: include
    why: 'Used: private medical-hospital beneficiaries (field ans_beneficiaries, December, municipality, over POPSVS), the private_coverage covariate of the admission-outcome
      models (shunt, death within the stay) and of the BYM2 context model of admission rates (lib/covariates.py, residence municipality of the admission year; 2012-2020
      take the 2021 stock, flagged).'
  intake:ans_beneficiaries_municipal:
    decision: exclude
    why: 'Quarterly ANS beneficiary counts (all and dental) by municipality, contract type, age and sex: the December medical-hospital stock (ans_beneficiaries) already
      carries private coverage; the dental series and quarterly detail have no bearing on a congenital anomaly cohort.'
  intake:ans_tiss_amb_cons:
    decision: exclude
    why: 'ANS TISS private outpatient events by provider UF: no procedure or diagnosis code for spina bifida follow-up or imaging; private-sector care of these children
      is not identifiable (stated as a limitation; CIHA has no postcode).'
  intake:ans_tiss_hosp_cons:
    decision: exclude
    why: 'ANS TISS private hospital events: CID filled by group only, too sparse for Q05 and hydrocephalus in children, so private closures and shunts cannot be counted;
      private coverage enters as ans_beneficiaries.'
  intake:bnafar:
    decision: exclude
    why: 'Medicine stock positions in BNAFAR/Horus by CNES and municipality (from 2025-03): pharmaceutical stock, outside the 2012-2023 period, not neurosurgical
      supply.'
  intake:census2010_domicilios:
    decision: exclude
    why: 'Census 2010 household microdata (housing, amenities, goods): a decade before the study end; census 2022 tables give the municipal covariates in use.'
  intake:census2010_emigracao:
    decision: exclude
    why: 'Census 2010 international emigrants: migration flow, no bearing on spina bifida at birth or its care.'
  intake:census2010_mortalidade:
    decision: exclude
    why: 'Census 2010 deaths of household members: self-reported household deaths, superseded by SIM, which the infant-death cohort links to SINASC.'
  intake:census2010_pessoas:
    decision: exclude
    why: 'Census 2010 person microdata (age, education, income, 245 columns, municipality): a 2010 baseline superseded by census 2022 income and literacy, which cover
      the births of 2012-2023 with one reference; maternal schooling of each birth comes from SINASC.'
  intake:health_regions:
    decision: include
    why: 'Used: municipality to health region and macroregion crosswalk (CODIGO_REGIAO_SAUDE, CODIGO_MACRORREGIAO_SAUDE), the grain of the prevalence-at-birth map,
      the health-region variation of admission ratios, the health-region random intercept of the shunt model, the treated-outside-home-region flag and the per-100,000
      supply denominators.'
  intake:inep:
    decision: exclude
    why: 'INEP school census enrolments: schooling of children and adolescents by school, not maternal education at the birth; maternal schooling is recorded in SINASC
      and area literacy from census 2022.'
  intake:pni_doses:
    decision: exclude
    why: 'National immunisation programme doses by residence: vaccination coverage (the maternal-condition field concerns vaccines, not folic acid); no pathway to
      neural tube closure or to closure and shunt outcomes.'
  intake:s2id:
    decision: exclude
    why: 'Civil-defence disaster records (S2iD): floods and droughts by municipality; rare events, not a systematic exposure or access variable for national birth
      and admission rates.'
  intake:sies:
    decision: exclude
    why: 'SIES strategic-input distribution (vaccines, serums): immunisation logistics, no bearing on spina bifida.'
  intake:siops_municipal:
    decision: exclude
    why: 'SIOPS municipal health spending (own resources, transfers, personnel, tax base): municipal declarations that do not fund paediatric neurosurgery, which
      is delivered by a few state and university referral hospitals reached through the health region; supply is read from CNES and access from distance to the nearest
      accredited unit and the outside-region flag.'
  intake:sisagua_control_basic:
    decision: exclude
    why: 'SISAGUA drinking-water control analyses by municipality: distribution-system sampling counts, not an exposure of mothers in the periconceptional window;
      no established pathway to spina bifida at birth or to its care; sanitation context is not a covariate of this paper.'
  intake:sisagua_control_other:
    decision: exclude
    why: 'SISAGUA drinking-water control analyses by municipality: distribution-system sampling counts, not an exposure of mothers in the periconceptional window;
      no established pathway to spina bifida at birth or to its care; sanitation context is not a covariate of this paper.'
  intake:sisagua_control_outside_standard:
    decision: exclude
    why: 'SISAGUA drinking-water control analyses by municipality: distribution-system sampling counts, not an exposure of mothers in the periconceptional window;
      no established pathway to spina bifida at birth or to its care; sanitation context is not a covariate of this paper.'
  intake:sisagua_supply_population:
    decision: exclude
    why: 'SISAGUA population supplied by water system: water logistics, no pathway to this condition.'
  intake:sisagua_surveillance_basic:
    decision: exclude
    why: 'SISAGUA drinking-water surveillance analyses by municipality: sampling counts of water quality, not maternal exposure; no pathway to spina bifida at birth
      or to its care.'
  intake:sisagua_surveillance_cyanobacteria:
    decision: exclude
    why: 'SISAGUA drinking-water surveillance analyses by municipality: sampling counts of water quality, not maternal exposure; no pathway to spina bifida at birth
      or to its care.'
  intake:sisagua_surveillance_other:
    decision: exclude
    why: 'SISAGUA drinking-water surveillance analyses by municipality: sampling counts of water quality, not maternal exposure; no pathway to spina bifida at birth
      or to its care.'
  intake:sisagua_tanker_population:
    decision: exclude
    why: 'SISAGUA tanker-truck supply population: water logistics, no pathway to this condition.'
  intake:sngpc_compounded:
    decision: exclude
    why: 'ANVISA SNGPC compounded-medicine sales by municipality and active ingredient (2019-2021 in the lake): a sales record with no prescribing link, so folic-acid
      supplementation cannot be measured, and 2012-2018 is absent.'
  intake:sngpc_industrialized:
    decision: exclude
    why: 'ANVISA SNGPC industrialised sales of controlled medicines and antimicrobials (2019-2021): folic acid is not a controlled substance and is not expected there;
      antiepileptic sales are not exposure in pregnancy, and the years do not cover the birth cohort.'
  intake:srag:
    decision: exclude
    why: 'SARI surveillance cases: respiratory infection burden, with no pathway to prevalence of spina bifida at birth; the pandemic years enter as year terms.'
  intake:yellow_fever_epizootics:
    decision: exclude
    why: 'Yellow-fever epizootics in non-human primates: infectious surveillance, no bearing.'
  intake:yellow_fever_humans:
    decision: exclude
    why: 'Yellow-fever human cases and deaths: infectious surveillance, no bearing.'
