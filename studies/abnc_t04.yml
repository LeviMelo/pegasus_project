  sidra:CD:Características do domicílio:
    decision: exclude
    why: 'Census 2022 household tables (water, sewer, waste, bathroom): the sewer share is built in lib/covariates.py but not read by this paper''s models; deprivation
      enters through the low-income and urban shares, and a sanitation pathway to neural tube closure is not established.'
  sidra:CD:Cor ou raça:
    decision: exclude
    why: 'Census 2022 colour or race shares: the newborn''s race is read individually from SINASC (RACACOR) as a 2012-2022 sensitivity, and an area share would duplicate
      it at a coarser grain.'
  sidra:CD:Domicílios:
    decision: exclude
    why: 'Census 2022 household counts by species and selected sectors: no content on income, access, services or births.'
  sidra:CD:Educação:
    decision: exclude
    why: Maternal schooling is modelled at the individual level from SINASC; an area literacy term would duplicate it at a coarser grain; not used.
  sidra:CD:Faces de logradouros:
    decision: exclude
    why: 'Census street-block faces in selected sectors: urbanism, not a health or demand variable.'
  sidra:CD:Famílias:
    decision: exclude
    why: 'Census family types: household structure, no demand, supply or access variable for this condition.'
  sidra:CD:Fecundidade:
    decision: exclude
    why: 'Census fertility of women (children born, by schooling and age, 2010 and 2022): a census-year area measure of parity, while the paper holds maternal age,
      schooling and the births themselves for every year from SINASC; not used.'
  sidra:CD:Geral:
    decision: exclude
    why: 'Census 2022 mixed tables (labour force, religion, quilombola households, establishments in selected sectors): nothing on income, schooling or services that
      the groups already included do not hold more completely.'
  sidra:CD:Indicadores demográficos:
    decision: exclude
    why: 'One table: ageing index and sex ratio of favela residents only; the paper''s denominators are births and infant residents (POPSVS).'
  sidra:CD:Migração:
    decision: exclude
    why: 'Census migration and nationality: no link to prevalence at birth; care-seeking flows come from SIH residence against hospital municipality.'
  sidra:CD:Migração e deslocamento:
    decision: exclude
    why: 'Census persons who lived outside the municipality: migration history, not care-seeking flows, which are measured from SIH.'
  sidra:CD:Mortalidade:
    decision: exclude
    why: 'One table: census 2022 deaths of former household members, self-reported household mortality; infant deaths come from SIM linked to SINASC.'
  sidra:CD:Nupcialidade:
    decision: exclude
    why: 'Census marital status: no bearing on this condition.'
  sidra:CD:Nupcialidade e fecundidade:
    decision: exclude
    why: 'Census marriage and fertility: no bearing beyond maternal age and the births already read from SINASC.'
  sidra:CD:Pessoas:
    decision: include
    why: 'Used: census 2022 urban share (population_urban over population_resident_census, municipality), a covariate of the admission-outcome models and of the BYM2
      context model; the age tables are not read, infant denominators come from POPSVS.'
  sidra:CD:População indígena:
    decision: exclude
    why: 'Census indigenous population: a narrow subgroup, not a municipal covariate of national birth and admission rates; indigenous mothers are a subject of their
      own.'
  sidra:CD:População quilombola:
    decision: exclude
    why: 'Census quilombola population: a narrow subgroup, not a municipal covariate of national rates.'
  sidra:CD:Registro civil:
    decision: exclude
    why: 'Census birth registration of children up to 5 years (2010, 2022): completeness of civil registration, whereas this paper counts births from SINASC and discusses
      the recorded-anomaly lower bound as recording, not registration.'
  sidra:CD:Religião:
