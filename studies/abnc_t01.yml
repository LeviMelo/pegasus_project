# abnc_t01: written by `pegasus study new`; every key is described in the README and ARCHITECTURE §3.1.
study: abnc_t01
topic:
  seeds:                       # the topic: ICD-10 codes (any level), SINAN agravos, label terms
    icd10: ["I60", "I671"]
    sigtap: ["0403040035", "0403040043", "0403040094", "0403040108", "0403040116", "0403040124", "0403070023", "0403070031", "0403070066", "0403070074", "0403070040", "0403070058", "0403070155", "0403070163", "0403070147"]
period: 2012-2024               # first-last year
where: BR                    # BR, states (AL or 27, several as a list) or municipality codes
depth: standard               # survey, standard, deep or exhaustive: presets of the choices below
# related: 3                   # related codes read beside the topic's own, strongest first (0: none)
# persons: true                # the cohort scan over linked persons (deep and exhaustive)
# download: 10                 # gigabytes the study may download (years held in the lake are free)
contexts: [persons_low_income, population_urban, population_resident_census, ans_beneficiaries, cnes_neurosurgeons_professionals, cnes_equipment_ct_sus]   # decided 2026-11-23 (contexts_considered below)
# hypotheses:                  # declared tests, e.g. an outbreak or a relation with its lags
#   - {component: transient, where: [431690], when: 2018, note: a documented outbreak}
# every context candidate decided from what its group holds (abnc2027_neuro papers/t01/contexts_considered.yml)
contexts_considered:
  intake:ans:
    decision: include
    why: 'Used: private medical-hospital beneficiaries (field ans_beneficiaries, December, municipality, over POPSVS), the private_coverage covariate of the g-computation,
      hierarchical, instrumental-variable and transition-context models and of the BYM2 context model of treatment rates (lib/covariates.py municipal(), residence
      municipality of the treatment year; 2012-2020 take the 2021 stock, flagged). Privately insured patients are treated outside the SUS, so coverage conditions
      who reaches the cohort.'
  intake:ans_beneficiaries_municipal:
    decision: exclude
    why: 'Quarterly ANS beneficiaries by municipality, contract type, age and sex: the December medical-hospital stock (ans_beneficiaries) already carries private
      coverage; the dental series and quarterly detail do not bear on aneurysm treatment.'
  intake:ans_tiss_amb_cons:
    decision: exclude
    why: 'ANS TISS private outpatient events by provider UF: columns hold CBO, consultation type and amounts but no procedure or imaging code, so private angiography
      or CT use cannot be identified; the private hospital events are the relevant private-sector series.'
  intake:ans_tiss_hosp_cons:
    decision: exclude
    why: Private-plan hospital events carry no procedure code, so private clipping and coiling cannot be told apart; the study's question is treatment in the SUS;
      not used.
  intake:bnafar:
    decision: exclude
    why: 'Medicine stock positions in BNAFAR/Horus by CNES and municipality (from 2025-03): pharmaceutical stock, outside the study years and not neurovascular supply.'
  intake:census2010_domicilios:
    decision: exclude
    why: 'Census 2010 household microdata (housing, amenities): a 2010 baseline, superseded by the census 2022 tables read (income, urban share), which fall inside
      the study period.'
  intake:census2010_emigracao:
    decision: exclude
    why: 'Census 2010 international emigrants: a 2010 baseline, superseded by the census 2022 tables read (income, urban share), which fall inside the study period;
      migration flow has no bearing on technique choice.'
  intake:census2010_mortalidade:
    decision: exclude
    why: 'Census 2010 deaths of household members (self-reported): a 2010 baseline, superseded by the census 2022 tables read (income, urban share), which fall inside
      the study period; deaths are read from SIM.'
  intake:census2010_pessoas:
    decision: exclude
    why: 'Census 2010 person microdata (age, education, income, 245 columns): a 2010 baseline, superseded by the census 2022 tables read (income, urban share), which
      fall inside the study period.'
  intake:health_regions:
    decision: include
    why: 'Used: municipality to health region and macroregion crosswalk (space.municipalities(): health_region, region), the grain of the standardised treatment ratios
      and funnel, the crossed residence-health-region random intercept, the outside-home-region treatment share and the coiling share by region.'
  intake:inep:
    decision: exclude
    why: 'INEP school census enrolments: schooling of children and adolescents; the cohort is adults and education is carried by the census where needed.'
  intake:pni_doses:
    decision: exclude
    why: 'National immunisation programme doses by residence: vaccination coverage, no bearing on aneurysm treatment.'
  intake:s2id:
    decision: exclude
    why: 'S2iD disaster damage records by municipality (floods, droughts): no pathway to aneurysm technique choice. Pandemic pressure on hospitals is handled through
      the year terms and a period sensitivity, not through disaster records.'
  intake:sies:
    decision: exclude
    why: 'Vaccine supply information system (SIES) distributed and requested doses: immunisation logistics, no bearing.'
  intake:siops_municipal:
    decision: exclude
    why: 'SIOPS municipal health spending (own resources, SUS transfers, personnel, tax base): municipal declarations; neurovascular treatment is delivered by a few
      state and university referral hospitals and paid through SIH billing, reached across the health region, so the residence municipality''s budget does not describe
      supply. Supply of the treating hospital is read from CNES (establishment, legal nature, volume) and access from distance to the nearest coiling- and clipping-capable
      centre.'
  intake:sisagua_control_basic:
    decision: exclude
    why: 'SISAGUA drinking-water control basic by municipality: water quality and supply, an environmental exposure with no pathway to aneurysm treatment choice or
      30-day death.'
  intake:sisagua_control_other:
    decision: exclude
    why: 'SISAGUA drinking-water control other by municipality: water quality and supply, an environmental exposure with no pathway to aneurysm treatment choice or
