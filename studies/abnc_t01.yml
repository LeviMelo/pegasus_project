  sidra:CD:Características do domicílio:
    decision: exclude
    why: 'Census 2022 household tables (sewer, water, waste, bathroom) are declared fields and the sewer share sits in covariates.municipal(), but no t01 model or
      map reads it: deprivation is carried by the census low-income share and urban share, and sanitation has no pathway to aneurysm technique choice or 30-day death.'
  sidra:CD:Cor ou raça:
    decision: exclude
    why: Census 2022 racial composition by municipality is not read by any t01 analysis; it is largely collinear with macroregion and the income tertile, both in
      the models. Disparity by race would need the individual records of the SIH, not an area share.
  sidra:CD:Domicílios:
    decision: exclude
    why: 'Census 2022 dwelling tables (type, tenure, occupancy): housing characteristics not read by the paper; deprivation enters as the low-income share.'
  sidra:CD:Educação:
    decision: exclude
    why: Census 2022 literacy of persons 15 or more is in covariates.municipal() but no t01 analysis reads it; the income tertile already carries the socioeconomic
      gradient (the two shares are strongly correlated across municipalities), and a third near-collinear share would not change the access reading.
  sidra:CD:Etnia:
    decision: exclude
    why: 'Census 2022 ethnicity (indigenous groups): small population groups; no bearing on technique choice.'
  sidra:CD:Faces de logradouros:
