  intake:sngpc_compounded:
    decision: exclude
    why: 'ANVISA controlled-substance compounded sales: pharmacy sales, no bearing on aneurysm treatment.'
  intake:sngpc_industrialized:
    decision: exclude
    why: 'ANVISA controlled-substance industrialised sales by CID: pharmacy sales of controlled drugs, not neurovascular supply or incidence.'
  intake:srag:
    decision: exclude
    why: 'SRAG severe respiratory illness notifications (influenza, COVID-19): hospital respiratory load that could touch 2020-2021 capacity, but the study handles
      the pandemic through year terms and a period sensitivity; the notification system is not a measure of neurovascular capacity.'
  intake:yellow_fever_epizootics:
    decision: exclude
    why: 'Yellow fever epizootics: vector-borne surveillance, no bearing.'
  intake:yellow_fever_humans:
    decision: exclude
    why: 'Yellow fever human cases: infectious disease surveillance, no bearing.'
