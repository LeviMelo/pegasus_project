# abnc_t01: written by `pegasus study new`; every key is described in the README and ARCHITECTURE §3.1.
study: abnc_t01
topic:
  seeds:                       # the topic: ICD-10 codes (any level), SINAN agravos, label terms
    icd10: ["I60", "I671"]
    sigtap: ["0403040035", "0403040043", "0403040094", "0403040108", "0403040116", "0403040124", "0403070023", "0403070031", "0403070066", "0403070074", "0403070040", "0403070058", "0403070155", "0403070163", "0403070147"]
period: 2012-2024               # first-last year
where: BR                    # BR, states (AL or 27, several as a list) or municipality codes
depth: standard               # survey, standard, deep or exhaustive: presets of the choices below
# related: 3                   # related codes read beside the topic's own, strongest first (0: none)
# persons: true                # the cohort scan over linked persons (deep and exhaustive)
# download: 10                 # gigabytes the study may download (years held in the lake are free)
contexts: [persons_low_income, population_urban, population_resident_census, ans_beneficiaries, cnes_neurosurgeons_professionals, cnes_equipment_ct_sus, cnes_equipment_hemodynamics_xray_sus, cnes_interventional_radiologists_professionals, sim_deaths_ill_defined]   # decided 2026-11-23; the last three 2026-11-24 at S1 (abnc2027_neuro papers/t01/protocol.md)
# hypotheses:                  # declared tests, e.g. an outbreak or a relation with its lags
#   - {component: transient, where: [431690], when: 2018, note: a documented outbreak}
# every context candidate decided from what its group holds (abnc2027_neuro papers/t01/contexts_considered.yml)
line: abnc_neuro
contexts_considered:
  intake:ans:
    decision: include
    why: 'Used: private medical-hospital beneficiaries (field ans_beneficiaries, December, municipality, over POPSVS), the private_coverage covariate of the g-computation, hierarchical, instrumental-variable and transition-context models and of the BYM2 context model of treatment rates (lib/covariates.py municipal(), residence municipality of the treatment year; 2012-2020 take the 2021 stock, flagged). Privately insured patients are treated outside the SUS, so coverage conditions who reaches the cohort.'
  intake:ans_tiss_hosp_cons:
    decision: exclude
    why: Private-plan hospital events carry no procedure code, so private clipping and coiling cannot be told apart; the study's question is treatment in the SUS; not used.
  intake:siops_municipal:
    decision: exclude
    why: 'SIOPS municipal health spending (own resources, SUS transfers, personnel, tax base): municipal declarations; neurovascular treatment is delivered by a few state and university referral hospitals and paid through SIH billing, reached across the health region, so the residence municipality''s budget does not describe supply. Supply of the treating hospital is read from CNES (establishment, legal nature, volume) and access from distance to the nearest coiling- and clipping-capable centre.'
  sidra:AA:Acidentes, violência e segurança:
    decision: exclude
    why: 'School Health Survey (PeNSE): schoolchildren aged 13-17, UF and capitals; the cohort is adults with aneurysm.'
  sidra:AA:Segurança:
    decision: exclude
    why: 'School Health Survey (PeNSE): schoolchildren aged 13-17, UF and capitals; the cohort is adults with aneurysm.'
  sidra:B5:Furto e roubo:
    decision: exclude
    why: 'Continuous PNAD (labour, household, income, ICT, tourism): quarterly household survey at UF and metropolitan grain, not municipal; the census income share is the area income covariate.'
  sidra:C2:Boa saúde e bem-estar:
    decision: exclude
    why: 'SDG 3 indicators (UF): health outcomes and coverage at state grain; the paper reads the records themselves.'
  sidra:C2:Paz, justiça e instituições eficazes:
    decision: exclude
    why: 'Sustainable Development Goals indicators (IBGE; UF and national): derived indicators duplicating primary sources considered elsewhere; coarse grain and no pathway to aneurysm treatment.'
  sidra:CD:Características do domicílio:
    decision: exclude
    why: 'Census 2022 household tables (sewer, water, waste, bathroom) are declared fields and the sewer share sits in covariates.municipal(), but no t01 model or map reads it: deprivation is carried by the census low-income share and urban share, and sanitation has no pathway to aneurysm technique choice or 30-day death.'
  sidra:CD:Educação:
    decision: exclude
    why: Census 2022 literacy of persons 15 or more is in covariates.municipal() but no t01 analysis reads it; the income tertile already carries the socioeconomic gradient (the two shares are strongly correlated across municipalities), and a third near-collinear share would not change the access reading.
  sidra:CD:Pessoas:
    decision: include
    why: 'Used: census 2022 urban share (population_urban over population_resident_census, municipality), a covariate of the outcome, hierarchical and instrumental-variable models and of the BYM2 context model; the age tables are not used (age and sex enter through the individual records and the standardisation).'
  sidra:CD:Rendimento:
    decision: include
    why: 'Used: census 2022 low-income share (persons_low_income over persons_income_universe, municipality), the tertile income_t (richer, mid, poorer) of the outcome, hierarchical and instrumental-variable models, and a covariate of the BYM2 context model; a static trait, not a yearly series.'
  sidra:IA:Índices de preços:
    decision: exclude
    why: 'Extended consumer price index (IPCA): prices; the cost deflator is applied in the money section and is not a context field.'
  sidra:IO:Contas Nacionais e Regionais:
    decision: exclude
    why: Municipal GDP per capita (field gdp) is in covariates.municipal() but no t01 analysis reads it; municipal GDP reflects industry and public-sector activity rather than household means, and the census low-income share is the income covariate. The treating hospital is usually a regional hub, so the residence municipality's GDP does not describe its financing.
  sidra:IU:Coeficiente de mortalidade por homicídios ou por acidentes de transporte:
    decision: exclude
    why: 'IBGE indicator of death by homicide or traffic accident (UF): injury mortality, not aneurysm; deaths are read from SIM.'
  sidra:PC:Índices de preços:
    decision: exclude
    why: 'National consumer price index (INPC) by metropolitan area: prices; costs are deflated in the money section with its own index, not as a context field.'
  sidra:XN:Acidentes:
    decision: exclude
    why: 'PNS road-traffic and household accident module (helmet, seat belt) by UF: injury risk behaviour, no bearing on aneurysm treatment.'
  sidra:XN:Doenças crônicas:
    decision: exclude
    why: 'PNS hypertension and other chronic-disease prevalence by UF (waves 2013 and 2019): hypertension is an aneurysm rupture risk factor and would bear on incidence, but the table is at UF grain with two time points, cannot enter municipal or hospital models, and the paper reads treatment rates as incidence mixed with access (stated as a limitation, not read as unmet need).'
  sidra:XN:Idosos:
    decision: exclude
    why: 'PNS older-adult module by UF (functional limitation, care): descriptive of ageing, no municipal or hospital grain; age enters through the individual age spline.'
  sidra:XN:Uso de serviço de saúde:
    decision: exclude
    why: 'PNS use of health services by UF (consultations, hospital stays): survey measures of access to care at state grain; access to aneurysm treatment is read from the records themselves (distance to coiling- and clipping-capable centres, outside-health-region treatment, hospital volume).'
  sidra:XN:Uso de álcool:
    decision: exclude
    why: 'PNS alcohol use by UF: a weak rupture risk factor at state grain with two waves; not joinable to the municipal or hospital grain.'
  sidra:XN:Violência:
    decision: exclude
    why: 'PNS table at UF grain (waves 2013 and 2019): survey prevalence of a condition or behaviour with no direct pathway to aneurysm technique choice and no municipal or hospital grain.'
  field:cnes:equipment:
    decision: include
    why: 'Used: SUS angiography suites (cnes_equipment_hemodynamics_xray_sus) by health region and year, the supply of the endovascular route in the model of who receives coiling (C2); SUS CT already included. Dialysis, EEG, mammography, MRI and slit-lamp counts have no pathway to aneurysm technique or outcome.'
  field:cnes:professionals:
    decision: include
    why: 'Used: interventional radiologists (cnes_interventional_radiologists_professionals) beside the neurosurgeons already included, by health region and year: the endovascular and open workforce in C2. The other professions (community agents, nurses, ophthalmologists, orthopaedists, paediatricians, radiotherapists, infectologists, physicians overall) do not bear on which technique a treated aneurysm receives.'
  field:records:SIM-DO:
    decision: include
    why: 'Used: the share of ill-defined underlying causes (sim_deaths_ill_defined) by municipality and year, the certification-quality rival of C5 (SAH deaths that reach treatment, by region). Garbage codes overlap it; deaths by residence are read from SIM records directly.'
  field:cnes:beds:
    decision: exclude
    why: 'Municipal bed counts do not measure the treating hospital: ICU use is read from the stay itself (ICU days) and capability from the treating CNES (habilitation, volume). Residence-municipality beds have no pathway to technique choice beyond the supply fields included.'
  field:cnes:facilities:
    decision: exclude
    why: 'Counts of facilities by type measure primary and outpatient supply; aneurysm treatment happens in a few hundred hospitals identified directly by CNES on the AIH.'
  field:cnes:radiotherapy_machines:
    decision: exclude
    why: 'Radiotherapy units: no bearing on intracranial aneurysm treatment.'
  field:intake:ans_tiss_hospital_items:
    decision: exclude
    why: 'Private-plan hospital items (TUSS) by provider: a private-sector series. The question is treatment paid by the SUS; private coverage enters as ans_beneficiaries.'
  field:brdwgd:gaussian:
    decision: exclude
    why: 'Climate by municipality: seasonality of aneurysm rupture is outside the question (technique, its determinants and outcome, access); no t01 claim is temporal below the year.'
  field:inmet:climate:
    decision: exclude
    why: 'Climate (station series): as field:brdwgd:gaussian, no claim below the year and no pathway to technique or outcome.'
  field:brdwgd:climate_monthly:
    decision: exclude
    why: 'Monthly climate: as field:brdwgd:gaussian.'
  field:brdwgd:precipitation_months:
    decision: exclude
    why: 'Precipitation months: as field:brdwgd:gaussian.'
  field:brdwgd:temperature_months:
    decision: exclude
    why: 'Temperature months: as field:brdwgd:gaussian.'
  sidra:RC:Óbitos:
    decision: include
    why: 'Used in C5 (SAH deaths that reach treatment, by region): civil-registry deaths against SIM deaths by state and year give the SIM coverage ratio. Under-registration in the North would lower its I60 death count and so the share never treated; the North''s contrast is reported with and without this calibration, beside the ill-defined share (line S0 review R5).'
  intake:ans_tiss_amb_cons:
    decision: exclude
    why: 'Consolidated outpatient TISS events by UF hold no diagnosis and no inpatient procedure; clipping and coiling are inpatient SUS operations, and private coverage enters as ans_beneficiaries (line S0 review R2).'
  field:intake:ans_tiss_outpatient_items:
    decision: exclude
    why: 'Outpatient TISS items carry TUSS codes without a diagnosis; aneurysm treatment is inpatient, and the question is care paid by the SUS (line S0 review R2).'
  intake:srag:
    decision: exclude
    why: 'SIVEP-Gripe severe respiratory illness: the pandemic enters as a period sensitivity (without 2020-2021; a period term); SRAG cases by municipality have no pathway to aneurysm technique or 30-day death beyond that (line S0 review R7).'
  field:cnes:teams:
    decision: exclude
    why: 'Primary-care team coverage measures first contact; ruptured aneurysms arrive through emergency services and unruptured ones by specialist referral, so team coverage places no t01 claim (line S0 review R3).'
